<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="210mm"
     viewBox="0 0 210 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodC" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="wallC" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="2" fill="#EEEEEE"/>
      <circle cx="1" cy="1" r="0.15" fill="#888" stroke="none"/>
    </pattern>
    <pattern id="magnetC" patternUnits="userSpaceOnUse" width="0.8" height="0.8" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#B0B0B8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#303036" stroke-width="0.12"/>
      <line x1="0" y1="0" x2="0.8" y2="0" stroke="#303036" stroke-width="0.12"/>
    </pattern>
    <pattern id="leatherC" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <marker id="arrC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrCR" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M5,0 L0,3 L5,6 L3.5,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="200" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g stroke="none">
    <text x="105" y="15" text-anchor="middle" font-size="5" font-weight="bold">Mount C — M4 Screw Detail</text>
    <text x="105" y="20" text-anchor="middle" font-size="2.8">Back-face prep for secure screw mount. Dimensions in mm. 1:1 scale.</text>
  </g>

  <!-- ===== BACK VIEW OF PUCK ===== -->
  <g transform="translate(55, 65)">
    <text x="0" y="-28" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">PUCK — BACK VIEW (Mount C)</text>
    <text x="0" y="-24" text-anchor="middle" font-size="2.6" stroke="none">after drilling 9 mm countersink</text>

    <!-- Puck outer Ø25 -->
    <circle cx="0" cy="0" r="12.5" fill="url(#woodC)" stroke="black" stroke-width="0.3"/>
    <!-- 9mm countersink -->
    <circle cx="0" cy="0" r="4.5" fill="white" stroke="black" stroke-width="0.3"/>
    <!-- 4.5mm through-hole in the middle -->
    <circle cx="0" cy="0" r="2.25" fill="none" stroke="black" stroke-width="0.25"/>
    <!-- Hidden Ø20 pocket -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="0.15" stroke-dasharray="1,0.6"/>

    <!-- Centerlines -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="black" stroke-width="0.1" stroke-dasharray="4,0.8,0.3,0.8"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="black" stroke-width="0.1" stroke-dasharray="4,0.8,0.3,0.8"/>

    <!-- Ø25 dim -->
    <line x1="-12.5" y1="-18" x2="12.5" y2="-18" stroke="black" stroke-width="0.2" marker-start="url(#arrCR)" marker-end="url(#arrC)"/>
    <text x="0" y="-18.5" text-anchor="middle" font-size="3" stroke="none">Ø25</text>

    <!-- Ø9 callout -->
    <line x1="3.18" y1="3.18" x2="15" y2="10" stroke="black" stroke-width="0.15"/>
    <line x1="15" y1="10" x2="22" y2="10" stroke="black" stroke-width="0.15"/>
    <text x="22.5" y="11" font-size="2.8" stroke="none">Ø9 × 2 deep (screw-head countersink)</text>

    <!-- Ø4.5 callout -->
    <line x1="1.59" y1="-1.59" x2="15" y2="-5" stroke="black" stroke-width="0.15"/>
    <line x1="15" y1="-5" x2="22" y2="-5" stroke="black" stroke-width="0.15"/>
    <text x="22.5" y="-4" font-size="2.8" stroke="none">Ø4.5 through-hole</text>

    <!-- Section marker -->
    <g stroke="none" font-size="3" font-weight="bold">
      <line x1="-17" y1="0" x2="-14" y2="0" stroke="black" stroke-width="0.4"/>
      <line x1="14" y1="0" x2="17" y2="0" stroke="black" stroke-width="0.4"/>
      <text x="-18.5" y="1" text-anchor="end">C</text>
      <text x="18.5" y="1">C</text>
    </g>
  </g>

  <!-- ===== SECTION C-C: puck + screw + wall ===== -->
  <g transform="translate(140, 65)">
    <text x="0" y="-28" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">SECTION C-C (installed)</text>
    <text x="0" y="-24" text-anchor="middle" font-size="2.6" stroke="none">screw driven through puck into wall anchor</text>

    <!-- Wall: from x=5 to x=30, y from -25 to 25 -->
    <rect x="5" y="-25" width="25" height="50" fill="url(#wallC)" stroke="black" stroke-width="0.3"/>
    <text x="17.5" y="30" text-anchor="middle" font-size="2.6" stroke="none">Drywall / stud</text>

    <!-- Anchor or pilot hole region: Ø5 hole from x=5 to x=22 (17mm deep anchor) -->
    <rect x="5" y="-2.5" width="17" height="5" fill="white" stroke="black" stroke-width="0.3"/>
    <text x="13.5" y="-4" text-anchor="middle" font-size="2.2" stroke="none">Ø5 pilot + anchor</text>

    <!-- Puck body: x from -13 to -1, y from -12.5 to 12.5 -->
    <rect x="-13" y="-12.5" width="12" height="25" fill="url(#woodC)" stroke="black" stroke-width="0.3"/>
    <!-- Leather on front -->
    <rect x="-14" y="-12.5" width="1" height="25" fill="url(#leatherC)" stroke="black" stroke-width="0.3"/>
    <!-- Magnet pocket -->
    <rect x="-11" y="-10" width="5" height="20" fill="white" stroke="none"/>
    <!-- Ring magnet -->
    <rect x="-11" y="-10" width="5" height="7.75" fill="url(#magnetC)" stroke="black" stroke-width="0.25"/>
    <rect x="-11" y="2.25" width="5" height="7.75" fill="url(#magnetC)" stroke="black" stroke-width="0.25"/>

    <!-- Through-hole Ø4.5 across entire puck -->
    <rect x="-14" y="-2.25" width="13" height="4.5" fill="white" stroke="none"/>
    <line x1="-14" y1="-2.25" x2="-1" y2="-2.25" stroke="black" stroke-width="0.25"/>
    <line x1="-14" y1="2.25" x2="-1" y2="2.25" stroke="black" stroke-width="0.25"/>

    <!-- Countersink at back face: Ø9 × 2 deep, on back side (right side in this section) from x=-3 to x=-1 -->
    <!-- Trapezoid-ish: hole widens from 4.5 to 9 at the back -->
    <polygon points="-3,-2.25 -3,2.25 -1,4.5 -1,-4.5" fill="white" stroke="black" stroke-width="0.3"/>

    <!-- Re-outline puck outer -->
    <line x1="-13" y1="-12.5" x2="-1" y2="-12.5" stroke="black" stroke-width="0.3"/>
    <line x1="-13" y1="12.5" x2="-1" y2="12.5" stroke="black" stroke-width="0.3"/>
    <line x1="-1" y1="-12.5" x2="-1" y2="-4.5" stroke="black" stroke-width="0.3"/>
    <line x1="-1" y1="4.5" x2="-1" y2="12.5" stroke="black" stroke-width="0.3"/>

    <!-- Screw: head in countersink, shaft through hole, point into wall -->
    <!-- Head: trapezoid from (-3,-4.5) to (-1,-4.5) to (-1,4.5) to (-3,2.25)... actually a flat-head screw -->
    <polygon points="-3,-2 -1,-4 -1,4 -3,2" fill="#666" stroke="black" stroke-width="0.2"/>
    <!-- Shaft: rectangle from x=-3 to x=22 -->
    <rect x="-3" y="-1.5" width="25" height="3" fill="#999" stroke="black" stroke-width="0.2"/>
    <!-- Tip -->
    <polygon points="22,-1.5 22,1.5 24,0" fill="#999" stroke="black" stroke-width="0.2"/>
    <!-- Thread indication (zigzag) -->
    <g stroke="black" stroke-width="0.1">
      <line x1="-1" y1="-1.5" x2="0" y2="-0.5"/>
      <line x1="1" y1="-1.5" x2="2" y2="-0.5"/>
      <line x1="3" y1="-1.5" x2="4" y2="-0.5"/>
      <line x1="5" y1="-1.5" x2="6" y2="-0.5"/>
      <line x1="7" y1="-1.5" x2="8" y2="-0.5"/>
      <line x1="9" y1="-1.5" x2="10" y2="-0.5"/>
      <line x1="11" y1="-1.5" x2="12" y2="-0.5"/>
      <line x1="13" y1="-1.5" x2="14" y2="-0.5"/>
      <line x1="15" y1="-1.5" x2="16" y2="-0.5"/>
      <line x1="17" y1="-1.5" x2="18" y2="-0.5"/>
      <line x1="19" y1="-1.5" x2="20" y2="-0.5"/>
    </g>

    <!-- Dims -->
    <line x1="-13" y1="15" x2="-1" y2="15" stroke="black" stroke-width="0.2" marker-start="url(#arrCR)" marker-end="url(#arrC)"/>
    <text x="-7" y="18" text-anchor="middle" font-size="2.8" stroke="none">12 puck</text>

    <line x1="-3" y1="-14" x2="-1" y2="-14" stroke="black" stroke-width="0.2" marker-start="url(#arrCR)" marker-end="url(#arrC)"/>
    <line x1="-4" y1="-14" x2="-8" y2="-19" stroke="black" stroke-width="0.15"/>
    <text x="-8" y="-19.5" text-anchor="end" font-size="2.4" stroke="none">2 countersink depth</text>

    <!-- Labels -->
    <text x="-13.5" y="-13.5" text-anchor="end" font-size="2.3" stroke="none">KNIFE SIDE →</text>
    <text x="30.5" y="-21.5" font-size="2.3" stroke="none">← WALL</text>
    <text x="10" y="6" font-size="2.2" stroke="none">M4 × 30 wood screw</text>
  </g>

  <!-- Notes -->
  <g transform="translate(20, 130)" stroke="none">
    <text x="0" y="0" font-size="3.5" font-weight="bold">MOUNT C INSTALL</text>
    <text x="0" y="5" font-size="2.6">1. Build puck body to spec (see puck-drawing.svg).</text>
    <text x="0" y="9" font-size="2.6">2. On puck back: drill 9 mm × 2 mm Forstner countersink, centered on the 4.5 mm through-hole.</text>
    <text x="0" y="13" font-size="2.6">3. Dry-fit screw: head should sit flush with back face. Deepen if it sits proud.</text>
    <text x="0" y="17" font-size="2.6">4. Mark wall. If drywall only: pre-drill Ø5, insert plastic M4 expansion anchor.</text>
    <text x="0" y="21" font-size="2.6">   If stud / wood panel: pre-drill Ø3 pilot.</text>
    <text x="0" y="25" font-size="2.6">5. Pass M4 × 30 countersunk wood screw through puck.</text>
    <text x="0" y="29" font-size="2.6">6. Drive until snug — do NOT overtighten (wood will crack around countersink).</text>
  </g>

  <g transform="translate(110, 130)" stroke="none">
    <text x="0" y="0" font-size="3.5" font-weight="bold">HARDWARE</text>
    <text x="0" y="5" font-size="2.6">• Screw: M4 × 30 mm countersunk (flat-head)</text>
    <text x="0" y="9" font-size="2.6">  wood screw, A2 stainless, Phillips or Torx.</text>
    <text x="0" y="13" font-size="2.6">• Head Ø nominal: 8.0–8.4 mm — fits 9 mm countersink.</text>
    <text x="0" y="17" font-size="2.6">• Anchor (drywall): plastic expansion sleeve for M4,</text>
    <text x="0" y="21" font-size="2.6">  min 25 mm long. Use Ø5 wall pilot.</text>
    <text x="0" y="25" font-size="2.6">• Anchor (stud / wood): none — Ø3 pilot only.</text>
    <text x="0" y="31" font-size="2.6" font-style="italic">Steel screw through the magnet bore is fine;</text>
    <text x="0" y="35" font-size="2.6" font-style="italic">it slightly boosts the magnetic circuit.</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80, 195)">
    <rect x="0" y="-2" width="50" height="4" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="0" y="-2" width="10" height="4" fill="black"/>
    <rect x="20" y="-2" width="10" height="4" fill="black"/>
    <rect x="40" y="-2" width="10" height="4" fill="black"/>
    <text x="25" y="-3.5" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">1:1 SCALE — 50 mm</text>
  </g>
</svg>
