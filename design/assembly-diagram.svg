<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm"
     viewBox="0 0 297 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodAS" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="panelAS" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#E0C88A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#805028" stroke-width="0.12"/>
    </pattern>
    <pattern id="wallAS" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="2" fill="#EEEEEE"/>
      <circle cx="1" cy="1" r="0.15" fill="#888" stroke="none"/>
    </pattern>
    <pattern id="leatherAS" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <pattern id="magnetAS" patternUnits="userSpaceOnUse" width="0.8" height="0.8" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#B0B0B8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#303036" stroke-width="0.12"/>
      <line x1="0" y1="0" x2="0.8" y2="0" stroke="#303036" stroke-width="0.12"/>
    </pattern>
  </defs>

  <rect x="5" y="5" width="287" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g stroke="none">
    <text x="148.5" y="14" text-anchor="middle" font-size="5" font-weight="bold">Assembly — Three Mount Options</text>
    <text x="148.5" y="19" text-anchor="middle" font-size="2.8">Exploded stack-ups. Same puck body for all three. Orientation: knife on left, wall on right.</text>
  </g>

  <!-- ================ MOUNT A: VHB ================ -->
  <g transform="translate(50, 55)">
    <text x="0" y="-25" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">Mount A — VHB Tape</text>

    <!-- Knife (just a blade edge symbol) -->
    <g transform="translate(-55, 0)">
      <rect x="0" y="-15" width="10" height="30" fill="#BBBBBB" stroke="black" stroke-width="0.2"/>
      <text x="5" y="20" text-anchor="middle" font-size="2.3" stroke="none">knife blade</text>
    </g>

    <!-- Leather disc -->
    <g transform="translate(-30, 0)">
      <rect x="0" y="-12.5" width="1" height="25" fill="url(#leatherAS)" stroke="black" stroke-width="0.2"/>
      <text x="0.5" y="-14" text-anchor="middle" font-size="2.3" stroke="none">leather</text>
      <text x="0.5" y="17" text-anchor="middle" font-size="2.3" stroke="none">1 mm</text>
    </g>

    <!-- Puck body (wood) with magnet -->
    <g transform="translate(-20, 0)">
      <!-- Wood body -->
      <rect x="0" y="-12.5" width="12" height="25" fill="url(#woodAS)" stroke="black" stroke-width="0.3"/>
      <!-- Magnet pocket cut out -->
      <rect x="2" y="-10" width="5" height="20" fill="white" stroke="none"/>
      <rect x="2" y="-10" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <rect x="2" y="2.25" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <!-- Through-hole -->
      <rect x="0" y="-2.25" width="12" height="4.5" fill="white" stroke="none"/>
      <line x1="0" y1="-2.25" x2="12" y2="-2.25" stroke="black" stroke-width="0.2"/>
      <line x1="0" y1="2.25" x2="12" y2="2.25" stroke="black" stroke-width="0.2"/>
      <!-- Re-outline puck body -->
      <line x1="0" y1="-12.5" x2="12" y2="-12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="12.5" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="-12.5" x2="0" y2="-2.25" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="2.25" x2="0" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="-12.5" x2="12" y2="-2.25" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="2.25" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <text x="6" y="-14" text-anchor="middle" font-size="2.3" stroke="none">wood + magnet</text>
      <text x="6" y="17" text-anchor="middle" font-size="2.3" stroke="none">12 mm</text>
    </g>

    <!-- VHB tape -->
    <g transform="translate(-5, 0)">
      <rect x="0" y="-10" width="1" height="20" fill="#EEDD88" stroke="black" stroke-width="0.2"/>
      <text x="0.5" y="-12" text-anchor="middle" font-size="2.3" stroke="none">VHB</text>
      <text x="0.5" y="14.5" text-anchor="middle" font-size="2.3" stroke="none">1 mm</text>
    </g>

    <!-- Wall -->
    <g transform="translate(3, 0)">
      <rect x="0" y="-20" width="20" height="40" fill="url(#wallAS)" stroke="black" stroke-width="0.2"/>
      <text x="10" y="24" text-anchor="middle" font-size="2.3" stroke="none">wall</text>
    </g>

    <!-- Connecting dotted lines to show assembly -->
    <g stroke="#999" stroke-width="0.15" stroke-dasharray="1,0.5">
      <line x1="-45" y1="0" x2="-30" y2="0"/>
      <line x1="-29" y1="0" x2="-20" y2="0"/>
      <line x1="-8" y1="0" x2="-5" y2="0"/>
      <line x1="-4" y1="0" x2="3" y2="0"/>
    </g>
  </g>

  <!-- ================ MOUNT B: DOWEL ================ -->
  <g transform="translate(148.5, 55)">
    <text x="0" y="-25" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">Mount B — Wood Dowel + Hidden Panel</text>

    <!-- Knife -->
    <g transform="translate(-55, 0)">
      <rect x="0" y="-15" width="10" height="30" fill="#BBBBBB" stroke="black" stroke-width="0.2"/>
      <text x="5" y="20" text-anchor="middle" font-size="2.3" stroke="none">knife blade</text>
    </g>

    <!-- Leather -->
    <g transform="translate(-30, 0)">
      <rect x="0" y="-12.5" width="1" height="25" fill="url(#leatherAS)" stroke="black" stroke-width="0.2"/>
      <text x="0.5" y="-14" text-anchor="middle" font-size="2.3" stroke="none">leather</text>
    </g>

    <!-- Puck body (with dowel socket on back) -->
    <g transform="translate(-20, 0)">
      <rect x="0" y="-12.5" width="12" height="25" fill="url(#woodAS)" stroke="black" stroke-width="0.3"/>
      <!-- Magnet pocket -->
      <rect x="2" y="-10" width="5" height="20" fill="white" stroke="none"/>
      <rect x="2" y="-10" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <rect x="2" y="2.25" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <!-- 10mm dowel socket on back (5mm deep) -->
      <rect x="7" y="-5" width="5" height="10" fill="white" stroke="black" stroke-width="0.3"/>
      <!-- re-outline -->
      <line x1="0" y1="-12.5" x2="12" y2="-12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="12.5" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="-12.5" x2="0" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="-12.5" x2="12" y2="-5" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="5" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <text x="6" y="-14" text-anchor="middle" font-size="2.3" stroke="none">puck w/ socket</text>
    </g>

    <!-- Dowel -->
    <g transform="translate(-5, 0)">
      <rect x="0" y="-5" width="10" height="10" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
      <text x="5" y="-7" text-anchor="middle" font-size="2.3" stroke="none">Ø10 dowel</text>
      <text x="5" y="11" text-anchor="middle" font-size="2.3" stroke="none">10 mm long</text>
    </g>

    <!-- Panel -->
    <g transform="translate(10, 0)">
      <rect x="0" y="-20" width="15" height="40" fill="url(#panelAS)" stroke="black" stroke-width="0.3"/>
      <!-- 5mm deep dowel hole on front of panel -->
      <rect x="0" y="-5" width="5" height="10" fill="white" stroke="black" stroke-width="0.3"/>
      <text x="7.5" y="-22" text-anchor="middle" font-size="2.3" stroke="none">back panel</text>
      <text x="7.5" y="24" text-anchor="middle" font-size="2.3" stroke="none">≥15 mm</text>
    </g>

    <!-- Wall behind panel -->
    <g transform="translate(28, 0)">
      <rect x="0" y="-20" width="10" height="40" fill="url(#wallAS)" stroke="black" stroke-width="0.2"/>
      <text x="5" y="24" text-anchor="middle" font-size="2.3" stroke="none">wall</text>
    </g>

    <!-- Connecting dotted lines -->
    <g stroke="#999" stroke-width="0.15" stroke-dasharray="1,0.5">
      <line x1="-45" y1="0" x2="-30" y2="0"/>
      <line x1="-29" y1="0" x2="-20" y2="0"/>
      <line x1="-8" y1="0" x2="-5" y2="0"/>
      <line x1="5" y1="0" x2="10" y2="0"/>
      <line x1="25" y1="0" x2="28" y2="0"/>
    </g>
  </g>

  <!-- ================ MOUNT C: SCREW ================ -->
  <g transform="translate(247, 55)">
    <text x="0" y="-25" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">Mount C — M4 Countersunk Screw</text>

    <!-- Knife -->
    <g transform="translate(-55, 0)">
      <rect x="0" y="-15" width="10" height="30" fill="#BBBBBB" stroke="black" stroke-width="0.2"/>
      <text x="5" y="20" text-anchor="middle" font-size="2.3" stroke="none">knife blade</text>
    </g>

    <!-- Leather -->
    <g transform="translate(-30, 0)">
      <rect x="0" y="-12.5" width="1" height="25" fill="url(#leatherAS)" stroke="black" stroke-width="0.2"/>
      <text x="0.5" y="-14" text-anchor="middle" font-size="2.3" stroke="none">leather</text>
    </g>

    <!-- Puck body with back countersink -->
    <g transform="translate(-20, 0)">
      <rect x="0" y="-12.5" width="12" height="25" fill="url(#woodAS)" stroke="black" stroke-width="0.3"/>
      <!-- Magnet pocket -->
      <rect x="2" y="-10" width="5" height="20" fill="white" stroke="none"/>
      <rect x="2" y="-10" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <rect x="2" y="2.25" width="5" height="7.75" fill="url(#magnetAS)" stroke="black" stroke-width="0.25"/>
      <!-- Through hole -->
      <rect x="0" y="-2.25" width="12" height="4.5" fill="white" stroke="none"/>
      <line x1="0" y1="-2.25" x2="10" y2="-2.25" stroke="black" stroke-width="0.2"/>
      <line x1="0" y1="2.25" x2="10" y2="2.25" stroke="black" stroke-width="0.2"/>
      <!-- Countersink at back: Ø9 × 2 deep -->
      <polygon points="10,-2.25 10,2.25 12,4.5 12,-4.5" fill="white" stroke="black" stroke-width="0.3"/>
      <!-- re-outline -->
      <line x1="0" y1="-12.5" x2="12" y2="-12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="12.5" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="-12.5" x2="0" y2="-2.25" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="2.25" x2="0" y2="12.5" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="-12.5" x2="12" y2="-4.5" stroke="black" stroke-width="0.3"/>
      <line x1="12" y1="4.5" x2="12" y2="12.5" stroke="black" stroke-width="0.3"/>
      <text x="6" y="-14" text-anchor="middle" font-size="2.3" stroke="none">puck w/ countersink</text>
    </g>

    <!-- Screw -->
    <g transform="translate(-6, 0)">
      <!-- flat head -->
      <polygon points="0,-4.5 2,-2 2,2 0,4.5" fill="#666" stroke="black" stroke-width="0.2"/>
      <!-- shaft -->
      <rect x="2" y="-1.5" width="22" height="3" fill="#999" stroke="black" stroke-width="0.2"/>
      <!-- tip -->
      <polygon points="24,-1.5 24,1.5 26,0" fill="#999" stroke="black" stroke-width="0.2"/>
      <text x="13" y="-6" text-anchor="middle" font-size="2.3" stroke="none">M4 × 30 countersunk</text>
    </g>

    <!-- Wall + anchor -->
    <g transform="translate(10, 0)">
      <rect x="0" y="-20" width="20" height="40" fill="url(#wallAS)" stroke="black" stroke-width="0.3"/>
      <!-- anchor / pilot -->
      <rect x="0" y="-2.5" width="17" height="5" fill="white" stroke="black" stroke-width="0.2"/>
      <text x="10" y="-22" text-anchor="middle" font-size="2.3" stroke="none">wall + anchor</text>
      <text x="10" y="24" text-anchor="middle" font-size="2.3" stroke="none">drywall: Ø5 + plastic plug</text>
      <text x="10" y="27" text-anchor="middle" font-size="2.3" stroke="none">stud: Ø3 pilot only</text>
    </g>

    <!-- Connecting dotted lines -->
    <g stroke="#999" stroke-width="0.15" stroke-dasharray="1,0.5">
      <line x1="-45" y1="0" x2="-30" y2="0"/>
      <line x1="-29" y1="0" x2="-20" y2="0"/>
    </g>
  </g>

  <!-- ====== Stack-up dimensions summary ====== -->
  <g transform="translate(30, 140)" stroke="none">
    <text x="0" y="0" font-size="4" font-weight="bold">INSTALLED DEPTH (from wall face to knife)</text>
    <text x="0" y="6" font-size="2.8">Mount A (VHB):   1 mm tape + 12 mm wood + 1 mm leather = <tspan font-weight="bold">14 mm</tspan></text>
    <text x="0" y="10" font-size="2.8">Mount B (Dowel): panel (user choice) + 5 mm dowel exposed + 12 mm wood + 1 mm leather = panel + <tspan font-weight="bold">13 mm</tspan></text>
    <text x="0" y="14" font-size="2.8">Mount C (Screw): 12 mm wood + 1 mm leather = <tspan font-weight="bold">13 mm</tspan> (screw head recessed in puck)</text>
    <text x="0" y="20" font-size="2.6" font-style="italic">All three are under the typical 15–20 mm profile of a commercial magnetic knife bar.</text>
  </g>

  <g transform="translate(30, 170)" stroke="none">
    <text x="0" y="0" font-size="4" font-weight="bold">COMMON PUCK BODY (all three mounts)</text>
    <text x="0" y="6" font-size="2.8">Ø25 mm × 12 mm hardwood + 1 mm leather face. Ø20 × 5 mm front magnet pocket. Ø4.5 mm through-hole.</text>
    <text x="0" y="10" font-size="2.8">One ring magnet SKU: N52, 20 OD × 5 thick × 4.5 ID. One puck design, three install paths.</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(120, 195)">
    <rect x="0" y="-2" width="50" height="4" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="0" y="-2" width="10" height="4" fill="black"/>
    <rect x="20" y="-2" width="10" height="4" fill="black"/>
    <rect x="40" y="-2" width="10" height="4" fill="black"/>
    <text x="25" y="-3.5" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">1:1 SCALE — 50 mm</text>
  </g>
</svg>
