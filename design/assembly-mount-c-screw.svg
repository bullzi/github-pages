<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm"
     viewBox="0 0 297 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="leatherHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <pattern id="magnetHatch" patternUnits="userSpaceOnUse" width="0.8" height="0.8" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#B0B0B8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#303036" stroke-width="0.12"/>
      <line x1="0" y1="0" x2="0.8" y2="0" stroke="#303036" stroke-width="0.12"/>
    </pattern>
    <pattern id="metalHatch" patternUnits="userSpaceOnUse" width="0.7" height="0.7" patternTransform="rotate(30)">
      <rect width="0.7" height="0.7" fill="#D0D0D6"/>
      <line x1="0" y1="0" x2="0" y2="0.7" stroke="#404048" stroke-width="0.1"/>
    </pattern>
    <pattern id="drywallHatch" patternUnits="userSpaceOnUse" width="1.6" height="1.6">
      <rect width="1.6" height="1.6" fill="#F4F1EA"/>
      <circle cx="0.4" cy="0.4" r="0.12" fill="#8A857B"/>
      <circle cx="1.1" cy="1.0" r="0.12" fill="#8A857B"/>
    </pattern>
    <pattern id="bladeHatch" patternUnits="userSpaceOnUse" width="1.0" height="1.0">
      <rect width="1.0" height="1.0" fill="#E8E8EC"/>
      <line x1="0" y1="0" x2="1.0" y2="1.0" stroke="#6A6A72" stroke-width="0.08"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrowFat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,4 L0,8 L2,4 z" fill="#222"/>
    </marker>

    <symbol id="forstner7" overflow="visible">
      <rect x="-3" y="-30" width="6" height="20" fill="#9AA0A8" stroke="black" stroke-width="0.25"/>
      <rect x="-3.5" y="-10" width="7" height="3" fill="#C0C5CC" stroke="black" stroke-width="0.25"/>
      <path d="M -3.5 -7 L 0 -4 L 3.5 -7 Z" fill="#909098" stroke="black" stroke-width="0.25"/>
    </symbol>

    <symbol id="screwM3" overflow="visible">
      <!-- countersunk M3 × 25; head Ø7 wide × 1.5 tall (proportional). Drawn vertically. cy=0 = head top. -->
      <path d="M -3.5 0 L 3.5 0 L 1.5 2 L -1.5 2 Z" fill="url(#metalHatch)" stroke="black" stroke-width="0.25"/>
      <rect x="-1.5" y="2" width="3" height="22" fill="url(#metalHatch)" stroke="black" stroke-width="0.25"/>
      <g stroke="black" stroke-width="0.13" fill="none">
        <line x1="-1.5" y1="5" x2="1.5" y2="6"/>
        <line x1="-1.5" y1="7.5" x2="1.5" y2="8.5"/>
        <line x1="-1.5" y1="10" x2="1.5" y2="11"/>
        <line x1="-1.5" y1="12.5" x2="1.5" y2="13.5"/>
        <line x1="-1.5" y1="15" x2="1.5" y2="16"/>
        <line x1="-1.5" y1="17.5" x2="1.5" y2="18.5"/>
        <line x1="-1.5" y1="20" x2="1.5" y2="21"/>
      </g>
      <path d="M -1.5 24 L 0 26.5 L 1.5 24 Z" fill="url(#metalHatch)" stroke="black" stroke-width="0.25"/>
      <!-- Phillips X on head -->
      <g stroke="black" stroke-width="0.2">
        <line x1="-1.2" y1="0.6" x2="1.2" y2="0.6"/>
        <line x1="0" y1="-0.6" x2="0" y2="1.6"/>
      </g>
    </symbol>
  </defs>

  <rect x="5" y="5" width="287" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g stroke="none">
    <text x="10" y="13" font-size="5" font-weight="bold">Mount C — M3 Screw · 6-Step Assembly</text>
    <text x="10" y="18" font-size="2.6">Illustrative — not to scale. Use puck-drawing.svg for true dimensions. Build pucks first (see knife-puck.md §"Assembly — puck body").</text>
  </g>

  <g fill="none" stroke="black" stroke-width="0.2">
    <rect x="6"   y="22"  width="92" height="88"/>
    <rect x="100" y="22"  width="92" height="88"/>
    <rect x="194" y="22"  width="92" height="88"/>
    <rect x="6"   y="114" width="92" height="88"/>
    <rect x="100" y="114" width="92" height="88"/>
    <rect x="194" y="114" width="92" height="88"/>
  </g>

  <!-- ============ Step 1: Drill countersink in puck back ============ -->
  <g transform="translate(52, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">1</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Drill Ø7 × 1.5 countersink</text>

    <g transform="translate(0, 5)">
      <!-- Leather strip on front (bottom of section) -->
      <rect x="-9" y="11" width="18" height="1.5" fill="url(#leatherHatch)" stroke="black" stroke-width="0.25"/>
      <!-- Wood puck side -->
      <rect x="-9" y="-1" width="18" height="12" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <!-- Existing through-hole Ø4 -->
      <line x1="-2" y1="-1" x2="-2" y2="12.5" stroke="black" stroke-width="0.2" stroke-dasharray="0.6,0.5"/>
      <line x1="2" y1="-1" x2="2" y2="12.5" stroke="black" stroke-width="0.2" stroke-dasharray="0.6,0.5"/>
      <!-- New countersink: Ø7 × 1.5 on top (back) face: tapered cone -->
      <path d="M -3.5 -1 L 3.5 -1 L 2 0.5 L -2 0.5 Z" fill="white" stroke="black" stroke-width="0.3"/>
      <!-- Depth dim -->
      <line x1="-5" y1="-1" x2="-5" y2="0.5" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="-6" y="0.4" text-anchor="end" font-size="2.0" stroke="none">1.5</text>
      <text x="11" y="0" font-size="2.0" stroke="none">Ø7</text>
    </g>

    <use href="#forstner7" x="0" y="4"/>
    <line x1="0" y1="-22" x2="0" y2="-12" stroke="#C22020" stroke-width="0.5" marker-end="url(#arrowFat)"/>

    <text x="0" y="33" text-anchor="middle" font-size="2.4" stroke="none">7 mm Forstner from back, just 1.5 mm deep — head must sit flush.</text>
  </g>

  <!-- ============ Step 2: Dry-fit screw ============ -->
  <g transform="translate(146, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">2</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Dry-fit M3 × 25 — head flush</text>

    <!-- Horizontal section: puck left, screw shaft right -->
    <g transform="translate(-6, 0)">
      <!-- Leather face (left) -->
      <rect x="-12" y="-9" width="1.5" height="18" fill="url(#leatherHatch)" stroke="black" stroke-width="0.25"/>
      <!-- Wood puck -->
      <rect x="-10.5" y="-9" width="12" height="18" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <!-- Magnet pocket (Ø12 × 5 from front): on left side -->
      <rect x="-10.5" y="-6" width="5" height="12" fill="url(#magnetHatch)" stroke="black" stroke-width="0.25"/>
      <!-- Through-hole Ø4 (white slot through center) -->
      <rect x="-10.5" y="-2" width="12" height="4" fill="white" stroke="black" stroke-width="0.2"/>
      <!-- Countersink on right (back) face -->
      <path d="M 1.5 -3.5 L 1.5 3.5 L 0 1.5 L 0 -1.5 Z" fill="white" stroke="black" stroke-width="0.3"/>
    </g>
    <!-- Screw inserted from right, head in countersink -->
    <g transform="translate(-4.5, 0) rotate(90)">
      <use href="#screwM3"/>
    </g>
    <!-- Shaft protruding 14 mm past back -->
    <line x1="-4.5" y1="-1.5" x2="-4.5" y2="-3" stroke="black" stroke-width="0.18"/>

    <!-- Annotations -->
    <line x1="0" y1="11" x2="14" y2="11" stroke="black" stroke-width="0.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="7" y="14" text-anchor="middle" font-size="2.0" stroke="none">shaft protrudes ~14</text>
    <line x1="-12" y1="-13" x2="0" y2="-13" stroke="black" stroke-width="0.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-6" y="-15" text-anchor="middle" font-size="2.0" stroke="none">12 (wood)</text>

    <text x="0" y="34" text-anchor="middle" font-size="2.4" stroke="none">Head must sit flush with back. Deepen c'sink in 0.3 steps if proud.</text>
  </g>

  <!-- ============ Step 3: Mark wall, pre-drill ============ -->
  <g transform="translate(240, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">3</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Mark wall, pre-drill</text>

    <!-- Wall -->
    <rect x="-38" y="-26" width="76" height="52" fill="url(#drywallHatch)" stroke="black" stroke-width="0.3"/>

    <!-- Two X marks 30-50 mm apart -->
    <g stroke="#C22020" stroke-width="0.6">
      <line x1="-3" y1="-12" x2="3" y2="-6"/>
      <line x1="3" y1="-12" x2="-3" y2="-6"/>
      <line x1="-3" y1="6" x2="3" y2="12"/>
      <line x1="3" y1="6" x2="-3" y2="12"/>
    </g>
    <line x1="-12" y1="-9" x2="-12" y2="9" stroke="black" stroke-width="0.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-14" y="2" text-anchor="end" font-size="2.0" stroke="none">30–50</text>

    <!-- Drill bit -->
    <g transform="translate(0, -9) rotate(0)">
      <rect x="-0.6" y="-20" width="1.2" height="15" fill="#9AA0A8" stroke="black" stroke-width="0.2"/>
      <path d="M -0.6 -5 L 0 -3 L 0.6 -5 Z" fill="#909098" stroke="black" stroke-width="0.2"/>
    </g>

    <text x="0" y="32" text-anchor="middle" font-size="2.4" stroke="none">Ø4 in drywall (anchor) or Ø2.5 in stud (pilot).</text>
  </g>

  <!-- ============ Step 4: Insert anchor ============ -->
  <g transform="translate(52, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">4</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Insert wall anchor (drywall only)</text>

    <!-- Wall section -->
    <rect x="-38" y="-20" width="76" height="40" fill="url(#drywallHatch)" stroke="black" stroke-width="0.3"/>

    <!-- Cutaway showing anchor inside -->
    <g transform="translate(-8, 0)">
      <path d="M -2 -16 L -2.6 16 L 2.6 16 L 2 -16 Z" fill="#E8D49A" stroke="black" stroke-width="0.3"/>
      <!-- expansion ribs -->
      <line x1="-2.3" y1="-8" x2="2.3" y2="-8" stroke="#8A6420" stroke-width="0.2"/>
      <line x1="-2.4" y1="0" x2="2.4" y2="0" stroke="#8A6420" stroke-width="0.2"/>
      <line x1="-2.5" y1="8" x2="2.5" y2="8" stroke="#8A6420" stroke-width="0.2"/>
      <!-- collar on outside -->
      <rect x="-3" y="-17" width="6" height="2" fill="#D8C080" stroke="black" stroke-width="0.25"/>
    </g>

    <!-- Pre-drilled hole next to it (empty) -->
    <g transform="translate(12, 0)">
      <rect x="-1" y="-16" width="2" height="32" fill="white" stroke="black" stroke-width="0.2" stroke-dasharray="0.6,0.4"/>
    </g>

    <!-- Hand or finger pushing anchor in (simple arrow) -->
    <line x1="-8" y1="-26" x2="-8" y2="-18" stroke="#C22020" stroke-width="0.6" marker-end="url(#arrowFat)"/>
    <text x="-8" y="-28" text-anchor="middle" font-size="2.0" stroke="none" fill="#C22020">tap in</text>

    <text x="0" y="32" text-anchor="middle" font-size="2.4" stroke="none">Plastic expansion anchor for M3 (drywall). Skip if hitting a stud.</text>
  </g>

  <!-- ============ Step 5: Drive screw through puck into anchor ============ -->
  <g transform="translate(146, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">5</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Drive screw through puck</text>

    <!-- Wall on right -->
    <rect x="20" y="-22" width="22" height="44" fill="url(#drywallHatch)" stroke="black" stroke-width="0.3"/>
    <!-- Anchor in wall -->
    <path d="M 22 -3 L 21.4 3 L 26 3 L 26.6 -3 Z" fill="#E8D49A" stroke="black" stroke-width="0.25"/>

    <!-- Puck side-view, leather facing left -->
    <g transform="translate(8, 0)">
      <rect x="-9" y="-12" width="18" height="24" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <rect x="-12" y="-12" width="3" height="24" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
      <!-- magnet inside -->
      <rect x="-9" y="-5" width="5" height="10" fill="url(#magnetHatch)" stroke="black" stroke-width="0.2"/>
      <!-- screw through center -->
      <path d="M 9 -3.5 L 9 3.5 L 7.5 1.5 L 7.5 -1.5 Z" fill="url(#metalHatch)" stroke="black" stroke-width="0.25"/>
      <rect x="7.5" y="-1.5" width="14" height="3" fill="url(#metalHatch)" stroke="black" stroke-width="0.25"/>
      <g stroke="black" stroke-width="0.13" fill="none">
        <line x1="9.5" y1="-1.5" x2="11" y2="1.5"/>
        <line x1="12" y1="-1.5" x2="13.5" y2="1.5"/>
        <line x1="14.5" y1="-1.5" x2="16" y2="1.5"/>
        <line x1="17" y1="-1.5" x2="18.5" y2="1.5"/>
      </g>
    </g>

    <!-- Screwdriver from left -->
    <g transform="translate(-22, 0)">
      <rect x="0" y="-3" width="12" height="6" fill="#3060B0" stroke="black" stroke-width="0.25" rx="1"/>
      <rect x="12" y="-1" width="10" height="2" fill="#9AA0A8" stroke="black" stroke-width="0.2"/>
      <path d="M 22 -1 L 23 0 L 22 1 Z" fill="#404048" stroke="black" stroke-width="0.2"/>
    </g>

    <!-- Rotation arrow -->
    <g transform="translate(-12, -10)">
      <path d="M -4 0 A 4 4 0 1 1 4 0" fill="none" stroke="#C22020" stroke-width="0.4" marker-end="url(#arrowFat)"/>
    </g>

    <text x="0" y="33" text-anchor="middle" font-size="2.4" stroke="none">Steel shaft through magnet bore actually boosts pull slightly.</text>
  </g>

  <!-- ============ Step 6: Snug, do not overtighten ============ -->
  <g transform="translate(240, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">6</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Snug — do NOT overtighten</text>

    <!-- Wall with puck installed -->
    <rect x="-38" y="-25" width="76" height="50" fill="url(#drywallHatch)" stroke="black" stroke-width="0.3"/>

    <!-- Puck flush against wall -->
    <g transform="translate(-12, 0)">
      <circle cx="0" cy="0" r="12" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
    </g>

    <!-- Caution callout box on right -->
    <g transform="translate(14, 0)">
      <rect x="-6" y="-12" width="22" height="24" fill="white" stroke="#C22020" stroke-width="0.4" rx="1"/>
      <text x="5" y="-7" text-anchor="middle" font-size="2.4" stroke="none" font-weight="bold" fill="#C22020">STOP AT</text>
      <text x="5" y="-3" text-anchor="middle" font-size="2.2" stroke="none">"firm,</text>
      <text x="5" y="0" text-anchor="middle" font-size="2.2" stroke="none">no wobble"</text>
      <text x="5" y="6" text-anchor="middle" font-size="1.8" stroke="none" fill="#C22020">overtight</text>
      <text x="5" y="9" text-anchor="middle" font-size="1.8" stroke="none" fill="#C22020">→ wood cracks</text>
    </g>

    <text x="0" y="33" text-anchor="middle" font-size="2.4" stroke="none">If the puck spins free, anchor failed — pull, upsize, or move to stud.</text>
  </g>

  <g transform="translate(146, 207)" font-size="2.2" stroke="none" text-anchor="middle">
    <text font-weight="bold">Materials per puck:</text>
    <text y="0" x="58">M3 × 25 c'sunk wood screw</text>
    <text y="0" x="115">+ plastic anchor (drywall only)</text>
  </g>
</svg>
