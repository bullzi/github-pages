<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm"
     viewBox="0 0 297 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="magnetHatch" patternUnits="userSpaceOnUse" width="0.8" height="0.8" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#B0B0B8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#303036" stroke-width="0.12"/>
      <line x1="0" y1="0" x2="0.8" y2="0" stroke="#303036" stroke-width="0.12"/>
    </pattern>
    <pattern id="leatherHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrowR" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M5,0 L0,3 L5,6 L3.5,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="287" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="10" y="13" font-size="5" font-weight="bold">Universal Magnetic Knife Puck — Body (v2: Ø18 × 12 mm)</text>
    <text x="10" y="18" font-size="2.8">All dimensions in mm. Drawing shows technical views at 1.5× scale for clarity — verify with the 50 mm scale bar before printing 1:1.</text>
    <text x="10" y="22" font-size="2.8">Material: dense hardwood (walnut / white oak / maple).  Magnet: N52 ring, 12×5×4 mm.  Front facing: 1 mm veg-tan leather.  Used in pairs.</text>
  </g>

  <!-- =================== FRONT VIEW (1.5x scale) =================== -->
  <g transform="translate(60, 70) scale(1.5)">
    <text x="0" y="-22" text-anchor="middle" font-size="3" font-weight="bold" stroke="none">FRONT VIEW (×1.5)</text>
    <text x="0" y="-18.5" text-anchor="middle" font-size="2" stroke="none">knife-facing side, leather visible</text>

    <!-- Outer body Ø18 -->
    <circle cx="0" cy="0" r="9" fill="url(#leatherHatch)" stroke="black" stroke-width="0.25"/>

    <!-- Hidden magnet pocket Ø12 -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="black" stroke-width="0.18" stroke-dasharray="1.2,0.8"/>
    <!-- Hidden through-hole Ø4 -->
    <circle cx="0" cy="0" r="2" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="1.2,0.8"/>

    <!-- Centerlines -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="black" stroke-width="0.1" stroke-dasharray="3,0.8,0.3,0.8"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="black" stroke-width="0.1" stroke-dasharray="3,0.8,0.3,0.8"/>

    <!-- Ø18 dim -->
    <line x1="-9" y1="-13" x2="9" y2="-13" stroke="black" stroke-width="0.18" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
    <line x1="-9" y1="-9" x2="-9" y2="-13.5" stroke="black" stroke-width="0.13"/>
    <line x1="9" y1="-9" x2="9" y2="-13.5" stroke="black" stroke-width="0.13"/>
    <rect x="-3" y="-15" width="6" height="2.5" fill="white" stroke="none"/>
    <text x="0" y="-13" text-anchor="middle" font-size="2.5" stroke="none">Ø18</text>

    <!-- Ø12 pocket leader -->
    <line x1="4.24" y1="-4.24" x2="11" y2="-10" stroke="black" stroke-width="0.13"/>
    <line x1="11" y1="-10" x2="17" y2="-10" stroke="black" stroke-width="0.13"/>
    <text x="17.5" y="-9.3" font-size="2.2" stroke="none">Ø12 × 5 deep (magnet pocket, hidden)</text>

    <!-- Ø4 through-hole leader -->
    <line x1="1.41" y1="-1.41" x2="9" y2="-5" stroke="black" stroke-width="0.13"/>
    <line x1="9" y1="-5" x2="17" y2="-5" stroke="black" stroke-width="0.13"/>
    <text x="17.5" y="-4.3" font-size="2.2" stroke="none">Ø4 through-hole</text>

    <!-- Section indicator A-A -->
    <g font-size="2.5" font-weight="bold" stroke="none">
      <line x1="-12" y1="0" x2="-10" y2="0" stroke="black" stroke-width="0.35"/>
      <line x1="10" y1="0" x2="12" y2="0" stroke="black" stroke-width="0.35"/>
      <text x="-13" y="1" text-anchor="end">A</text>
      <text x="13" y="1">A</text>
    </g>
  </g>

  <!-- =================== SECTION A-A (1.5x scale) =================== -->
  <g transform="translate(170, 65) scale(1.5)">
    <text x="0" y="-22" text-anchor="middle" font-size="3" font-weight="bold" stroke="none">SECTION A-A (×1.5)</text>
    <text x="0" y="-18.5" text-anchor="middle" font-size="2" stroke="none">vertical cut through center</text>

    <!-- Leather: 18 wide, 1 tall -->
    <rect x="-9" y="-1" width="18" height="1" fill="url(#leatherHatch)" stroke="black" stroke-width="0.2"/>

    <!-- Wood body: 18 wide, 12 tall -->
    <rect x="-9" y="0" width="18" height="12" fill="url(#woodHatch)" stroke="black" stroke-width="0.25"/>

    <!-- Magnet pocket: 12 wide, 5 tall, from y=2 to y=7 -->
    <rect x="-6" y="2" width="12" height="5" fill="white" stroke="none"/>
    <!-- Ring magnet: two bands separated by 4mm gap -->
    <rect x="-6" y="2" width="4" height="5" fill="url(#magnetHatch)" stroke="black" stroke-width="0.2"/>
    <rect x="2" y="2" width="4" height="5" fill="url(#magnetHatch)" stroke="black" stroke-width="0.2"/>

    <!-- Through-hole 4 wide, full depth -->
    <rect x="-2" y="-1" width="4" height="13" fill="white" stroke="none"/>
    <line x1="-2" y1="-1" x2="-2" y2="12" stroke="black" stroke-width="0.2"/>
    <line x1="2" y1="-1" x2="2" y2="12" stroke="black" stroke-width="0.2"/>

    <!-- Re-outline -->
    <line x1="-9" y1="0" x2="-9" y2="12" stroke="black" stroke-width="0.25"/>
    <line x1="9" y1="0" x2="9" y2="12" stroke="black" stroke-width="0.25"/>
    <line x1="-9" y1="12" x2="9" y2="12" stroke="black" stroke-width="0.25"/>

    <!-- Callouts -->
    <!-- Front wall 2 -->
    <line x1="-6" y1="0" x2="-6" y2="2" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="-6" y1="0" x2="-15" y2="-3" stroke="black" stroke-width="0.13"/>
    <text x="-28" y="-3" font-size="2.2" stroke="none">front wall 2 mm</text>

    <!-- Leather 1 -->
    <line x1="11" y1="-1" x2="11" y2="0" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="12" y="0" font-size="2.2" stroke="none">leather 1</text>

    <!-- Wood thickness 12 -->
    <line x1="14" y1="0" x2="14" y2="12" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="9" y1="0" x2="15" y2="0" stroke="black" stroke-width="0.13"/>
    <line x1="9" y1="12" x2="15" y2="12" stroke="black" stroke-width="0.13"/>
    <text x="15" y="7" font-size="2.5" stroke="none">12 (wood)</text>

    <!-- Magnet 5 -->
    <line x1="-11" y1="2" x2="-11" y2="7" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="-9" y1="2" x2="-12" y2="2" stroke="black" stroke-width="0.13"/>
    <line x1="-9" y1="7" x2="-12" y2="7" stroke="black" stroke-width="0.13"/>
    <text x="-12" y="5" text-anchor="end" font-size="2.5" stroke="none">5</text>

    <!-- Back wood 5 -->
    <line x1="-11" y1="7" x2="-11" y2="12" stroke="black" stroke-width="0.18" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-12" y="10.2" text-anchor="end" font-size="2.5" stroke="none">5 back</text>

    <!-- OD 18 -->
    <line x1="-9" y1="17" x2="9" y2="17" stroke="black" stroke-width="0.18" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
    <line x1="-9" y1="12" x2="-9" y2="17.5" stroke="black" stroke-width="0.13"/>
    <line x1="9" y1="12" x2="9" y2="17.5" stroke="black" stroke-width="0.13"/>
    <text x="0" y="20" text-anchor="middle" font-size="2.5" stroke="none">Ø18 (puck OD)</text>

    <!-- Magnet OD 12 -->
    <line x1="-6" y1="14" x2="6" y2="14" stroke="black" stroke-width="0.18" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
    <line x1="-6" y1="7" x2="-6" y2="14.5" stroke="black" stroke-width="0.13"/>
    <line x1="6" y1="7" x2="6" y2="14.5" stroke="black" stroke-width="0.13"/>
    <text x="0" y="16.5" text-anchor="middle" font-size="2.5" stroke="none">Ø12 magnet</text>

    <!-- Through-hole 4 -->
    <line x1="-2" y1="-4" x2="2" y2="-4" stroke="black" stroke-width="0.18" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
    <text x="0" y="-5" text-anchor="middle" font-size="2.3" stroke="none">Ø4 through</text>

    <text x="0" y="-1.7" text-anchor="middle" font-size="1.5" stroke="none" fill="white">LEATHER</text>
  </g>

  <!-- =================== BACK VIEW =================== -->
  <g transform="translate(60, 160) scale(1.5)">
    <text x="0" y="-22" text-anchor="middle" font-size="3" font-weight="bold" stroke="none">BACK VIEW (×1.5)</text>
    <text x="0" y="-18.5" text-anchor="middle" font-size="2" stroke="none">wall-facing side, as shipped</text>

    <circle cx="0" cy="0" r="9" fill="url(#woodHatch)" stroke="black" stroke-width="0.25"/>
    <circle cx="0" cy="0" r="2" fill="white" stroke="black" stroke-width="0.25"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="black" stroke-width="0.13" stroke-dasharray="1.2,0.8"/>

    <line x1="-12" y1="0" x2="12" y2="0" stroke="black" stroke-width="0.1" stroke-dasharray="3,0.8,0.3,0.8"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="black" stroke-width="0.1" stroke-dasharray="3,0.8,0.3,0.8"/>

    <line x1="1.41" y1="1.41" x2="9" y2="5" stroke="black" stroke-width="0.13"/>
    <line x1="9" y1="5" x2="17" y2="5" stroke="black" stroke-width="0.13"/>
    <text x="17.5" y="5.7" font-size="2.2" stroke="none">Ø4 through-hole (visible)</text>

    <line x1="4.24" y1="4.24" x2="11" y2="10" stroke="black" stroke-width="0.13"/>
    <line x1="11" y1="10" x2="17" y2="10" stroke="black" stroke-width="0.13"/>
    <text x="17.5" y="10.7" font-size="2.2" stroke="none">Ø12 magnet pocket (hidden)</text>

    <g transform="translate(0, 16)" stroke="none">
      <text x="0" y="0" text-anchor="middle" font-size="2.5" font-weight="bold">BACK-FACE MOUNT PREP</text>
      <text x="0" y="4" text-anchor="middle" font-size="2.2">A · VHB: no additional drilling</text>
      <text x="0" y="7" text-anchor="middle" font-size="2.2">B · Dowel: 8 mm Forstner × 5 mm deep</text>
      <text x="0" y="10" text-anchor="middle" font-size="2.2">C · Screw: 7 mm × 1.5 mm countersink</text>
    </g>
  </g>

  <!-- =================== NOTES =================== -->
  <g transform="translate(150, 125)" stroke="none">
    <text x="0" y="0" font-size="3.5" font-weight="bold">NOTES</text>
    <text x="0" y="5" font-size="2.6">1. All dimensions in mm. Tolerance ±0.3 mm.</text>
    <text x="0" y="9" font-size="2.6">2. Magnet pocket drilled from FRONT with 12 mm Forstner, 5 mm deep.</text>
    <text x="0" y="13" font-size="2.6">3. Through-hole drilled FIRST with 4 mm twist bit from front; pilots all later drilling.</text>
    <text x="0" y="17" font-size="2.6">4. Magnet is N52 ring 12×5×4 mm; bonded with 5-min epoxy.</text>
    <text x="0" y="21" font-size="2.6">5. Front wall (2 mm wood + 1 mm leather) is critical; do not thin further.</text>
    <text x="0" y="25" font-size="2.6">6. <tspan font-weight="bold">Use in pairs.</tspan> Two pucks per knife is the default, 3 for 270 mm+, 4 for 300 mm heavy.</text>
    <text x="0" y="29" font-size="2.6">7. Per-puck pull ≈ 2–2.5 kg through coverings. Two pucks ≈ 4–5 kg total.</text>
    <text x="0" y="33" font-size="2.6">8. See mount-b-dowel-detail.svg and mount-c-screw-detail.svg for back-face prep.</text>
  </g>

  <g transform="translate(100, 188)">
    <rect x="0" y="-2" width="50" height="4" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="0" y="-2" width="10" height="4" fill="black"/>
    <rect x="20" y="-2" width="10" height="4" fill="black"/>
    <rect x="40" y="-2" width="10" height="4" fill="black"/>
    <text x="25" y="-3.5" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">1:1 SCALE — measure 50 mm with a ruler</text>
    <text x="0" y="6" font-size="2.5" stroke="none">0</text>
    <text x="50" y="6" font-size="2.5" text-anchor="end" stroke="none">50 mm</text>
  </g>
</svg>
