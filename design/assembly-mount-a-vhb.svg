<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm"
     viewBox="0 0 297 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="leatherHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <pattern id="tapeHatch" patternUnits="userSpaceOnUse" width="1.2" height="1.2">
      <rect width="1.2" height="1.2" fill="#F4A8A8"/>
      <line x1="0" y1="0.6" x2="1.2" y2="0.6" stroke="#A24040" stroke-width="0.12"/>
    </pattern>
    <pattern id="drywallHatch" patternUnits="userSpaceOnUse" width="1.6" height="1.6">
      <rect width="1.6" height="1.6" fill="#F4F1EA"/>
      <circle cx="0.4" cy="0.4" r="0.12" fill="#8A857B"/>
      <circle cx="1.1" cy="1.0" r="0.12" fill="#8A857B"/>
    </pattern>
    <pattern id="bladeHatch" patternUnits="userSpaceOnUse" width="1.0" height="1.0">
      <rect width="1.0" height="1.0" fill="#E8E8EC"/>
      <line x1="0" y1="0" x2="1.0" y2="1.0" stroke="#6A6A72" stroke-width="0.08"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrowFat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,4 L0,8 L2,4 z" fill="#222"/>
    </marker>

    <!-- Reusable: a back-view puck (looking at wall side: wood face + tiny center hole) -->
    <symbol id="puckBack" overflow="visible">
      <circle cx="0" cy="0" r="12" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="2.7" fill="white" stroke="black" stroke-width="0.25"/>
    </symbol>
    <!-- Reusable: a front-view puck (leather face) -->
    <symbol id="puckFront" overflow="visible">
      <circle cx="0" cy="0" r="12" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
    </symbol>
    <!-- Reusable: 3/4 puck (oblique) with leather front-right, wood top, wood back -->
    <symbol id="puckOblique" overflow="visible">
      <ellipse cx="0" cy="0" rx="12" ry="3.3" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <path d="M -12 0 L -12 8 A 12 3.3 0 0 0 12 8 L 12 0" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <ellipse cx="0" cy="8" rx="12" ry="3.3" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
    </symbol>
  </defs>

  <rect x="5" y="5" width="287" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g stroke="none">
    <text x="10" y="13" font-size="5" font-weight="bold">Mount A — VHB Tape · 6-Step Assembly</text>
    <text x="10" y="18" font-size="2.6">Illustrative — not to scale. Use puck-drawing.svg for true dimensions. Build pucks first (see knife-puck.md §"Assembly — puck body").</text>
  </g>

  <!-- ============ Panel frames ============ -->
  <g fill="none" stroke="black" stroke-width="0.2">
    <rect x="6"   y="22"  width="92" height="88"/>
    <rect x="100" y="22"  width="92" height="88"/>
    <rect x="194" y="22"  width="92" height="88"/>
    <rect x="6"   y="114" width="92" height="88"/>
    <rect x="100" y="114" width="92" height="88"/>
    <rect x="194" y="114" width="92" height="88"/>
  </g>

  <!-- ============ Step 1: Clean ============ -->
  <g transform="translate(52, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">1</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Clean both surfaces</text>

    <!-- puck back view -->
    <use href="#puckBack" x="-14" y="0"/>
    <text x="-14" y="18" text-anchor="middle" font-size="2.2" stroke="none">puck back</text>

    <!-- IPA bottle -->
    <g transform="translate(18, -8)">
      <rect x="-3" y="0" width="6" height="14" fill="#9EC7E2" stroke="black" stroke-width="0.25" rx="0.6"/>
      <rect x="-2" y="-3" width="4" height="3" fill="#444" stroke="black" stroke-width="0.25"/>
      <rect x="-2.5" y="4" width="5" height="5" fill="white" stroke="black" stroke-width="0.2"/>
      <text x="0" y="7.5" text-anchor="middle" font-size="1.6" stroke="none" font-weight="bold">IPA</text>
    </g>
    <!-- cloth wiping puck -->
    <g transform="translate(-2, -2) rotate(-15)">
      <path d="M -6 -3 Q 0 -5 6 -3 L 6 3 Q 0 5 -6 3 Z" fill="white" stroke="black" stroke-width="0.25"/>
      <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#888" stroke-width="0.15"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#888" stroke-width="0.15"/>
      <line x1="-3" y1="2" x2="3" y2="2" stroke="#888" stroke-width="0.15"/>
    </g>

    <text x="0" y="35" text-anchor="middle" font-size="2.4" stroke="none">Wipe puck back AND wall spot with isopropyl. Let dry 1 min.</text>
  </g>

  <!-- ============ Step 2: Apply tape ============ -->
  <g transform="translate(146, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">2</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Apply VHB to puck back</text>

    <use href="#puckBack" x="-12" y="0"/>

    <!-- VHB square on top -->
    <rect x="-22" y="-7" width="14" height="14" fill="url(#tapeHatch)" stroke="black" stroke-width="0.3"/>
    <text x="-15" y="0" text-anchor="middle" font-size="1.8" stroke="none">VHB</text>
    <text x="-15" y="2.5" text-anchor="middle" font-size="1.8" stroke="none">15×15</text>

    <!-- arrow showing application -->
    <line x1="-6" y1="0" x2="-3" y2="0" stroke="black" stroke-width="0.3" marker-end="url(#arrowFat)"/>

    <!-- liner being peeled off the back of VHB -->
    <g transform="translate(-30, -12)">
      <path d="M 0 0 Q 4 -2 8 0 L 8 4 Q 4 2 0 4 Z" fill="#FFE090" stroke="black" stroke-width="0.25"/>
      <text x="4" y="3" text-anchor="middle" font-size="1.6" stroke="none">liner</text>
    </g>

    <text x="0" y="35" text-anchor="middle" font-size="2.4" stroke="none">Peel one VHB liner, center on puck back. Press firmly.</text>
  </g>

  <!-- ============ Step 3: Peel second liner ============ -->
  <g transform="translate(240, 66)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">3</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Peel outer liner</text>

    <!-- puck oblique with VHB layer -->
    <g transform="translate(0, -6)">
      <use href="#puckOblique"/>
      <ellipse cx="0" cy="8" rx="12" ry="3.3" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
      <!-- VHB on back: above puck top ellipse (negative Y) -->
      <ellipse cx="0" cy="0" rx="9" ry="2.4" fill="url(#tapeHatch)" stroke="black" stroke-width="0.3"/>
      <path d="M -9 0 L -9 -1.5 A 9 2.4 0 0 0 9 -1.5 L 9 0" fill="url(#tapeHatch)" stroke="black" stroke-width="0.3"/>
      <ellipse cx="0" cy="-1.5" rx="9" ry="2.4" fill="url(#tapeHatch)" stroke="black" stroke-width="0.3"/>
    </g>

    <!-- liner being peeled off -->
    <g transform="translate(0, -25)">
      <path d="M -12 0 Q -6 -4 0 -2 Q 6 0 12 -3" fill="none" stroke="#A24040" stroke-width="0.4"/>
      <path d="M -12 -1 Q -6 -5 0 -3 Q 6 -1 12 -4 L 12 -1 Q 6 2 0 0 Q -6 -2 -12 2 Z" fill="#FFE090" stroke="black" stroke-width="0.25"/>
      <line x1="-15" y1="-5" x2="-12" y2="-2" stroke="black" stroke-width="0.25" marker-start="url(#arrow)"/>
    </g>

    <text x="0" y="35" text-anchor="middle" font-size="2.4" stroke="none">Peel the second liner just before pressing on the wall.</text>
  </g>

  <!-- ============ Step 4: Press + hold ============ -->
  <g transform="translate(52, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">4</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Press hard for 20 seconds</text>

    <!-- Wall on right -->
    <rect x="20" y="-25" width="22" height="50" fill="url(#drywallHatch)" stroke="black" stroke-width="0.3"/>
    <!-- VHB strip on wall side of puck -->
    <rect x="17" y="-7" width="3" height="14" fill="url(#tapeHatch)" stroke="black" stroke-width="0.25"/>
    <!-- Puck side view (front circle facing left) -->
    <g transform="translate(8, 0)">
      <rect x="-9" y="-12" width="18" height="24" fill="url(#woodHatch)" stroke="black" stroke-width="0.3"/>
      <rect x="-12" y="-12" width="3" height="24" fill="url(#leatherHatch)" stroke="black" stroke-width="0.3"/>
    </g>

    <!-- Big push arrow from left -->
    <line x1="-22" y1="0" x2="-5" y2="0" stroke="#C22020" stroke-width="0.8" marker-end="url(#arrowFat)"/>
    <text x="-13" y="-3" text-anchor="middle" font-size="2.2" stroke="none" fill="#C22020" font-weight="bold">push hard</text>

    <!-- Timer icon -->
    <g transform="translate(0, 22)">
      <circle cx="0" cy="0" r="4" fill="white" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="0" y2="-3" stroke="black" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="2.5" y2="1" stroke="black" stroke-width="0.3"/>
      <text x="7" y="1" font-size="2.4" stroke="none" font-weight="bold">20 s</text>
    </g>

    <text x="0" y="36" text-anchor="middle" font-size="2.4" stroke="none">Press with body weight. VHB needs pressure to bond.</text>
  </g>

  <!-- ============ Step 5: Repeat, wait 24h ============ -->
  <g transform="translate(146, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">5</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Second puck + 24 h cure</text>

    <!-- Wall background -->
    <rect x="-35" y="-25" width="70" height="50" fill="url(#drywallHatch)" stroke="black" stroke-width="0.25"/>

    <!-- Two pucks 40 mm apart (scaled to 30 in drawing for fit) -->
    <use href="#puckFront" x="0" y="-15"/>
    <use href="#puckFront" x="0" y="15"/>

    <!-- Spine line (knife will sit here) -->
    <line x1="0" y1="-12" x2="0" y2="12" stroke="black" stroke-width="0.2" stroke-dasharray="1.2,0.8"/>

    <!-- spacing dim -->
    <line x1="-18" y1="-15" x2="-18" y2="15" stroke="black" stroke-width="0.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-20" y="2" text-anchor="end" font-size="2.2" stroke="none">30–50 mm</text>

    <!-- 24h callout -->
    <g transform="translate(22, 0)">
      <rect x="-2" y="-6" width="14" height="12" fill="white" stroke="black" stroke-width="0.3" rx="1"/>
      <text x="5" y="-2" text-anchor="middle" font-size="2.6" stroke="none" font-weight="bold">24 h</text>
      <text x="5" y="2" text-anchor="middle" font-size="1.8" stroke="none">cure</text>
      <text x="5" y="4.5" text-anchor="middle" font-size="1.6" stroke="none">do not load</text>
    </g>

    <text x="0" y="36" text-anchor="middle" font-size="2.4" stroke="none">Repeat for the second puck. Wait 24 h before hanging.</text>
  </g>

  <!-- ============ Step 6: Test with sacrificial knife ============ -->
  <g transform="translate(240, 158)">
    <text x="-44" y="-39" font-size="4" font-weight="bold" stroke="none">6</text>
    <text x="-37" y="-39" font-size="2.8" font-weight="bold" stroke="none">Test with a cheap knife</text>

    <!-- Wall -->
    <rect x="-35" y="-25" width="70" height="50" fill="url(#drywallHatch)" stroke="black" stroke-width="0.25"/>

    <!-- Knife silhouette: santoku-like, vertical -->
    <g>
      <!-- blade -->
      <path d="M -3 -22 L 3 -22 L 5 -18 L 5 12 L 4 14 L -4 14 L -5 12 L -5 -18 Z" fill="url(#bladeHatch)" stroke="black" stroke-width="0.3"/>
      <!-- handle -->
      <rect x="-3" y="14" width="6" height="12" fill="#7A5530" stroke="black" stroke-width="0.3"/>
      <!-- bolster -->
      <rect x="-3.5" y="12" width="7" height="2" fill="#404040" stroke="black" stroke-width="0.2"/>
    </g>

    <!-- Pucks behind blade (hidden but indicated with dashed circles) -->
    <circle cx="0" cy="-8" r="4" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="0.8,0.6"/>
    <circle cx="0" cy="8" r="4" fill="none" stroke="black" stroke-width="0.2" stroke-dasharray="0.8,0.6"/>

    <!-- Pull-test arrow -->
    <line x1="10" y1="-5" x2="18" y2="-12" stroke="#C22020" stroke-width="0.4" marker-end="url(#arrowFat)"/>
    <text x="20" y="-12" font-size="2.0" stroke="none" fill="#C22020">tug-test</text>

    <text x="0" y="36" text-anchor="middle" font-size="2.4" stroke="none">Tug, twist, and bump-test before trusting your best blade.</text>
  </g>

  <!-- ============ Legend strip ============ -->
  <g transform="translate(146, 207)" font-size="2.2" stroke="none" text-anchor="middle">
    <text font-weight="bold">Materials per puck:</text>
    <text y="0" x="60">VHB 4941 15×15 mm</text>
    <text y="0" x="120">+ already-built Ø18 puck</text>
  </g>
</svg>
