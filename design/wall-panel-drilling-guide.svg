<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="420mm" height="297mm"
     viewBox="0 0 420 297"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="10" height="10">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#DDDDDD" stroke-width="0.1"/>
    </pattern>
    <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="50" height="50">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#AAAAAA" stroke-width="0.2"/>
    </pattern>
    <marker id="arrPG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrPGR" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M5,0 L0,3 L5,6 L3.5,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="410" height="287" fill="none" stroke="black" stroke-width="0.2"/>

  <g stroke="none">
    <text x="210" y="15" text-anchor="middle" font-size="6" font-weight="bold">Wall Panel Drilling Guide — Multi-Puck Layout</text>
    <text x="210" y="21" text-anchor="middle" font-size="3">Planning template for Mount B. Grid = 10 mm minor / 50 mm major. Print at 100% and overlay on panel stock, OR transfer positions with a ruler.</text>
  </g>

  <!-- ========== LAYOUT ZONE with grid ========== -->
  <g transform="translate(20, 35)">
    <!-- Border of layout area: 380 × 200 -->
    <rect x="0" y="0" width="380" height="200" fill="url(#gridMinor)" stroke="black" stroke-width="0.3"/>
    <rect x="0" y="0" width="380" height="200" fill="url(#gridMajor)" stroke="none"/>

    <!-- Major grid labels -->
    <g font-size="2.2" stroke="none" fill="#555">
      <text x="0" y="-1">0</text>
      <text x="50" y="-1">50</text>
      <text x="100" y="-1">100</text>
      <text x="150" y="-1">150</text>
      <text x="200" y="-1">200</text>
      <text x="250" y="-1">250</text>
      <text x="300" y="-1">300</text>
      <text x="350" y="-1">350</text>
      <text x="380" y="-1">380 mm</text>
      <text x="-2" y="2" text-anchor="end">0</text>
      <text x="-2" y="52" text-anchor="end">50</text>
      <text x="-2" y="102" text-anchor="end">100</text>
      <text x="-2" y="152" text-anchor="end">150</text>
      <text x="-2" y="200" text-anchor="end">200 mm</text>
    </g>

    <!-- Example 5-knife layout with dowel positions -->
    <!-- Horizontal spacing ~60mm between knives, knives staggered in Y for visual balance -->

    <!-- KNIFE 1: Nakiri 165mm (2 pucks) -->
    <g transform="translate(50, 50)">
      <!-- Knife silhouette: blade flat on top, handle on bottom, vertical orientation -->
      <!-- Nakiri outline: blade 165 long, 50 wide, handle 120 long, ~25 Ø -->
      <!-- Rotated 90deg so it hangs vertically, tip down -->
      <!-- We'll draw blades hanging vertically (tip down, handle up) -->
      <g>
        <!-- Handle (top): rectangle 120 long × 25 wide -->
        <rect x="-12.5" y="-120" width="25" height="120" fill="#6B3410" stroke="black" stroke-width="0.2" opacity="0.5"/>
        <!-- Blade: 165 long, 50 wide at the top (near handle), tapers slightly. Nakiri is fairly square. -->
        <path d="M -20 0 L 20 0 L 20 155 L -20 165 Z" fill="#CCCCCC" stroke="black" stroke-width="0.3" opacity="0.7"/>
      </g>
      <!-- Puck positions (dots) along the blade spine -->
      <circle cx="-12" cy="20" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="-12" cy="20" r="5" fill="red" stroke="none"/>
      <circle cx="-12" cy="60" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="-12" cy="60" r="5" fill="red" stroke="none"/>

      <text x="0" y="-125" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">Nakiri 165</text>
      <text x="0" y="-121" text-anchor="middle" font-size="2.2" stroke="none">2 pucks</text>
    </g>

    <!-- KNIFE 2: Gyuto 210mm (2 pucks) -->
    <g transform="translate(120, 30)">
      <g>
        <rect x="-10" y="-130" width="20" height="130" fill="#6B3410" stroke="black" stroke-width="0.2" opacity="0.5"/>
        <!-- Gyuto blade: 210 long, ~45 wide at heel, tapers to tip -->
        <path d="M -5 0 L 22 0 L 20 180 L -2 210 Z" fill="#CCCCCC" stroke="black" stroke-width="0.3" opacity="0.7"/>
      </g>
      <circle cx="12" cy="25" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="12" cy="25" r="5" fill="red" stroke="none"/>
      <circle cx="10" cy="80" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="10" cy="80" r="5" fill="red" stroke="none"/>

      <text x="0" y="-135" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">Gyuto 210</text>
      <text x="0" y="-131" text-anchor="middle" font-size="2.2" stroke="none">2 pucks</text>
    </g>

    <!-- KNIFE 3: Sujihiki 270mm (3 pucks) -->
    <g transform="translate(190, 10)">
      <g>
        <rect x="-9" y="-130" width="18" height="130" fill="#6B3410" stroke="black" stroke-width="0.2" opacity="0.5"/>
        <!-- Sujihiki: long, narrow, 270 long × 30 wide -->
        <path d="M -3 0 L 15 0 L 12 240 L -2 270 Z" fill="#CCCCCC" stroke="black" stroke-width="0.3" opacity="0.7"/>
      </g>
      <circle cx="8" cy="25" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="8" cy="25" r="5" fill="red" stroke="none"/>
      <circle cx="7" cy="95" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="7" cy="95" r="5" fill="red" stroke="none"/>
      <circle cx="6" cy="165" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="6" cy="165" r="5" fill="red" stroke="none"/>

      <text x="0" y="-135" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">Sujihiki 270</text>
      <text x="0" y="-131" text-anchor="middle" font-size="2.2" stroke="none">3 pucks</text>
    </g>

    <!-- KNIFE 4: Deba 180mm (2 pucks) - deba is thick and tall at heel -->
    <g transform="translate(260, 40)">
      <g>
        <rect x="-10" y="-125" width="20" height="125" fill="#6B3410" stroke="black" stroke-width="0.2" opacity="0.5"/>
        <!-- Deba: 180 long, 55 wide at heel -->
        <path d="M -8 0 L 27 0 L 22 155 L -2 180 Z" fill="#CCCCCC" stroke="black" stroke-width="0.3" opacity="0.7"/>
      </g>
      <circle cx="15" cy="25" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="15" cy="25" r="5" fill="red" stroke="none"/>
      <circle cx="13" cy="70" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="13" cy="70" r="5" fill="red" stroke="none"/>

      <text x="0" y="-130" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">Deba 180</text>
      <text x="0" y="-126" text-anchor="middle" font-size="2.2" stroke="none">2 pucks</text>
    </g>

    <!-- KNIFE 5: Yanagiba 300mm (4 pucks) -->
    <g transform="translate(330, 5)">
      <g>
        <rect x="-9" y="-130" width="18" height="130" fill="#6B3410" stroke="black" stroke-width="0.2" opacity="0.5"/>
        <!-- Yanagiba: 300 long, 30 wide -->
        <path d="M -3 0 L 15 0 L 10 270 L 0 300 Z" fill="#CCCCCC" stroke="black" stroke-width="0.3" opacity="0.7"/>
      </g>
      <circle cx="8" cy="20" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="8" cy="20" r="5" fill="red" stroke="none"/>
      <circle cx="7" cy="80" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="7" cy="80" r="5" fill="red" stroke="none"/>
      <circle cx="6" cy="140" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="6" cy="140" r="5" fill="red" stroke="none"/>
      <circle cx="5" cy="195" r="12.5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <circle cx="5" cy="195" r="5" fill="red" stroke="none"/>

      <text x="0" y="-135" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">Yanagiba 300</text>
      <text x="0" y="-131" text-anchor="middle" font-size="2.2" stroke="none">4 pucks</text>
    </g>
  </g>

  <!-- ====== LEGEND & RULES ====== -->
  <g transform="translate(20, 250)" stroke="none">
    <text x="0" y="0" font-size="4" font-weight="bold">LEGEND</text>
    <g transform="translate(0, 6)">
      <circle cx="5" cy="2" r="5" fill="red" stroke="none"/>
      <text x="14" y="3.2" font-size="2.8">Ø10 dowel hole (drill Ø10 Forstner × 5–8 mm deep at this center)</text>
    </g>
    <g transform="translate(0, 14)">
      <circle cx="5" cy="2" r="5" fill="none" stroke="red" stroke-width="0.4" stroke-dasharray="1,0.6"/>
      <text x="14" y="3.2" font-size="2.8">Puck footprint Ø25 (shown for clearance reference — nothing to drill here)</text>
    </g>
    <g transform="translate(0, 22)">
      <rect x="0" y="-1" width="10" height="6" fill="#CCCCCC" stroke="black" stroke-width="0.2" opacity="0.7"/>
      <text x="14" y="3.2" font-size="2.8">Knife silhouette (not drilled; drawn to scale for visual planning only)</text>
    </g>
  </g>

  <g transform="translate(180, 250)" stroke="none">
    <text x="0" y="0" font-size="4" font-weight="bold">PLACEMENT RULES</text>
    <text x="0" y="6" font-size="2.8">• Place pucks along the blade's spine, 20–30 mm back from the spine edge.</text>
    <text x="0" y="10" font-size="2.8">• First puck: 20–30 mm below the handle-blade junction (catches the heel).</text>
    <text x="0" y="14" font-size="2.8">• Puck-to-puck spacing along a blade: 40–60 mm for even support.</text>
    <text x="0" y="18" font-size="2.8">• Knife-to-knife horizontal spacing: ≥60 mm center-to-center (avoid magnet interaction).</text>
    <text x="0" y="22" font-size="2.8">• Keep pucks ≥20 mm from the edge of the back panel.</text>
    <text x="0" y="26" font-size="2.8">• If mounting over a counter, bottom of longest knife should clear the counter by ≥40 mm.</text>
  </g>

  <g transform="translate(280, 250)" stroke="none">
    <text x="0" y="0" font-size="4" font-weight="bold">PUCK COUNT</text>
    <text x="0" y="6" font-size="2.8">petty / paring ≤150: 1 puck</text>
    <text x="0" y="10" font-size="2.8">160–240 mm standard: 2 pucks</text>
    <text x="0" y="14" font-size="2.8">270 mm: 3 pucks</text>
    <text x="0" y="18" font-size="2.8">300 mm or heavy deba: 4 pucks</text>
    <text x="0" y="24" font-size="2.6" font-style="italic">(see knife-puck.md for full table)</text>
  </g>

  <!-- Scale bar bottom-right -->
  <g transform="translate(340, 280)">
    <rect x="0" y="-2" width="50" height="4" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="0" y="-2" width="10" height="4" fill="black"/>
    <rect x="20" y="-2" width="10" height="4" fill="black"/>
    <rect x="40" y="-2" width="10" height="4" fill="black"/>
    <text x="25" y="-3.5" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">1:1 SCALE — 50 mm</text>
  </g>
</svg>
