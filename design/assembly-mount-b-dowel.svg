<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="297mm"
     viewBox="0 0 210 297"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <!-- Puck oblique view (cylinder, leather face up) -->
    <g id="puckObliqueB">
      <rect x="-12.5" y="0" width="25" height="12" fill="#E9D49E" stroke="black" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="12.5" ry="4" fill="#A0552A" stroke="black" stroke-width="0.4"/>
      <path d="M -12.5 12 A 12.5 4 0 0 0 12.5 12" fill="none" stroke="black" stroke-width="0.4"/>
    </g>

    <!-- Puck back-up (wood top showing through-hole) -->
    <g id="puckBackB">
      <rect x="-12.5" y="0" width="25" height="12" fill="#E9D49E" stroke="black" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="12.5" ry="4" fill="#E9D49E" stroke="black" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="2.25" ry="0.7" fill="white" stroke="black" stroke-width="0.3"/>
      <path d="M -12.5 12 A 12.5 4 0 0 0 12.5 12" fill="none" stroke="black" stroke-width="0.4"/>
      <path d="M -12.5 12 A 12.5 4 0 0 1 12.5 12" fill="#A0552A" stroke="black" stroke-width="0.4" opacity="0.7"/>
    </g>

    <!-- Puck back AFTER drilling 10mm socket -->
    <g id="puckBackDrilled">
      <rect x="-12.5" y="0" width="25" height="12" fill="#E9D49E" stroke="black" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="12.5" ry="4" fill="#E9D49E" stroke="black" stroke-width="0.4"/>
      <!-- 10mm socket -->
      <ellipse cx="0" cy="0" rx="5" ry="1.6" fill="#5A4020" stroke="black" stroke-width="0.4"/>
      <path d="M -12.5 12 A 12.5 4 0 0 0 12.5 12" fill="none" stroke="black" stroke-width="0.4"/>
      <path d="M -12.5 12 A 12.5 4 0 0 1 12.5 12" fill="#A0552A" stroke="black" stroke-width="0.4" opacity="0.7"/>
    </g>

    <!-- Hardwood dowel (cylinder) -->
    <g id="dowel">
      <rect x="-5" y="0" width="10" height="10" fill="#D4A95F" stroke="black" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="5" ry="1.6" fill="#E9CF9C" stroke="black" stroke-width="0.4"/>
      <path d="M -5 10 A 5 1.6 0 0 0 5 10" fill="none" stroke="black" stroke-width="0.4"/>
    </g>

    <!-- Wall panel (3D box) -->
    <g id="wallPanel">
      <!-- front face -->
      <rect x="0" y="0" width="60" height="50" fill="#E0C88A" stroke="black" stroke-width="0.4"/>
      <!-- top face going back-up-right -->
      <polygon points="0,0 60,0 68,-8 8,-8" fill="#C8AC60" stroke="black" stroke-width="0.4"/>
      <!-- right face -->
      <polygon points="60,0 68,-8 68,42 60,50" fill="#A88840" stroke="black" stroke-width="0.4"/>
      <!-- wood grain -->
      <g stroke="#8B6F3A" stroke-width="0.15" fill="none">
        <path d="M 5 12 Q 30 10 55 12"/>
        <path d="M 5 22 Q 30 20 55 22"/>
        <path d="M 5 32 Q 30 30 55 32"/>
        <path d="M 5 42 Q 30 40 55 42"/>
      </g>
    </g>

    <!-- Wall (drywall background) -->
    <g id="wallBgB">
      <rect x="0" y="0" width="60" height="50" fill="#F0F0F0" stroke="black" stroke-width="0.3"/>
      <polygon points="0,0 60,0 66,-6 6,-6" fill="#D8D8D8" stroke="black" stroke-width="0.3"/>
      <polygon points="60,0 66,-6 66,44 60,50" fill="#C0C0C0" stroke="black" stroke-width="0.3"/>
      <g fill="#999" stroke="none">
        <circle cx="10" cy="12" r="0.3"/><circle cx="25" cy="8" r="0.3"/><circle cx="42" cy="18" r="0.3"/>
        <circle cx="18" cy="28" r="0.3"/><circle cx="36" cy="35" r="0.3"/><circle cx="50" cy="40" r="0.3"/>
      </g>
    </g>

    <!-- Drill (Forstner bit) -->
    <g id="drill">
      <!-- Drill body -->
      <rect x="-3" y="-25" width="6" height="15" fill="#1976D2" stroke="black" stroke-width="0.3"/>
      <!-- Chuck -->
      <rect x="-2" y="-10" width="4" height="3" fill="#888" stroke="black" stroke-width="0.3"/>
      <!-- Bit shaft -->
      <rect x="-0.5" y="-7" width="1" height="3" fill="#666" stroke="black" stroke-width="0.2"/>
      <!-- Forstner bit head -->
      <rect x="-3" y="-4" width="6" height="4" fill="#999" stroke="black" stroke-width="0.3"/>
      <!-- Center spur -->
      <polygon points="0,0 -0.5,-0.5 0.5,-0.5" fill="black"/>
    </g>

    <!-- Glue bottle -->
    <g id="glueBottle">
      <rect x="-3" y="-12" width="6" height="9" fill="#FFE0E0" stroke="black" stroke-width="0.3"/>
      <polygon points="-2,-12 2,-12 1,-15 -1,-15" fill="#888" stroke="black" stroke-width="0.3"/>
      <text x="0" y="-7" text-anchor="middle" font-size="2.2" stroke="none" font-weight="bold">GLUE</text>
      <!-- drop -->
      <ellipse cx="0" cy="0" rx="1" ry="2" fill="#FFE0E0" stroke="black" stroke-width="0.3"/>
    </g>

    <!-- Step number -->
    <g id="stepNumB">
      <circle cx="0" cy="0" r="5" fill="#388E3C" stroke="black" stroke-width="0.3"/>
    </g>

    <!-- Knife mini -->
    <g id="knifeMiniB">
      <rect x="-3" y="-30" width="6" height="20" fill="#5A2A10" stroke="black" stroke-width="0.3"/>
      <path d="M -5 -10 L 5 -10 L 4 35 L -2 40 Z" fill="#B0B0B8" stroke="black" stroke-width="0.3"/>
    </g>

    <marker id="aMarkerB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,4 L0,8 L2,4 z" fill="black"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="200" height="287" fill="none" stroke="black" stroke-width="0.3"/>

  <!-- Title bar -->
  <g>
    <rect x="5" y="5" width="200" height="22" fill="#388E3C" stroke="black" stroke-width="0.3"/>
    <text x="15" y="17" font-size="7" font-weight="bold" stroke="none" fill="white">MOUNT B — HIDDEN DOWEL</text>
    <text x="15" y="23" font-size="3" stroke="none" fill="white">Universal Magnetic Knife Puck — Assembly Instructions</text>
    <text x="200" y="17" font-size="5" text-anchor="end" stroke="none" fill="white" font-weight="bold">B</text>
    <text x="200" y="23" font-size="2.5" text-anchor="end" stroke="none" fill="white">~30 min build  ·  overnight glue cure</text>
  </g>

  <!-- ===== PARTS PANEL ===== -->
  <g transform="translate(15, 35)">
    <rect x="0" y="0" width="180" height="32" fill="#FAFAFA" stroke="black" stroke-width="0.3"/>
    <text x="3" y="6" font-size="3.5" font-weight="bold" stroke="none">PARTS YOU NEED</text>

    <g transform="translate(20, 22)">
      <use href="#puckObliqueB"/>
      <text x="0" y="20" text-anchor="middle" font-size="2.5" stroke="none">Puck × 1–4 per knife</text>
    </g>

    <g transform="translate(58, 22)">
      <g transform="translate(-3,0)"><use href="#dowel"/></g>
      <text x="0" y="20" text-anchor="middle" font-size="2.5" stroke="none">10 mm dowel × 10 mm</text>
    </g>

    <g transform="translate(95, 26)">
      <g transform="scale(0.4)"><use href="#wallPanel"/></g>
      <text x="12" y="-2" text-anchor="middle" font-size="2.5" stroke="none">Hardwood back panel</text>
      <text x="12" y="2" text-anchor="middle" font-size="2.3" stroke="none">(≥15 mm thick)</text>
    </g>

    <g transform="translate(140, 22)">
      <use href="#glueBottle"/>
      <text x="0" y="8" text-anchor="middle" font-size="2.5" stroke="none">Wood glue</text>
    </g>

    <g transform="translate(170, 22)">
      <use href="#drill" transform="scale(0.7)"/>
      <text x="0" y="8" text-anchor="middle" font-size="2.5" stroke="none">10 mm Forstner</text>
    </g>
  </g>

  <!-- ====== STEP 1 ====== -->
  <g transform="translate(15, 75)">
    <rect x="0" y="0" width="85" height="65" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">1</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">DRILL PUCK BACK</text>

    <g transform="translate(42.5, 38)">
      <!-- Puck back-up -->
      <g transform="translate(0, 5)"><use href="#puckBackB"/></g>
      <!-- Drill coming down -->
      <g transform="translate(0, -10)"><use href="#drill"/></g>
      <!-- Down arrow -->
      <path d="M 0 12 L 0 5" stroke="black" stroke-width="0.8" marker-end="url(#aMarkerB)"/>
      <!-- callout -->
      <text x="20" y="0" font-size="2.5" stroke="none">Ø10 × 5 deep</text>
      <line x1="0" y1="5" x2="18" y2="0" stroke="black" stroke-width="0.2"/>
    </g>
    <text x="42.5" y="58" text-anchor="middle" font-size="2.8" stroke="none">Puck back-up. Drill 10 mm Forstner, 5 mm deep, centered.</text>
    <text x="42.5" y="62" text-anchor="middle" font-size="2.4" stroke="none" font-style="italic">Aim for friction fit on the dowel.</text>
  </g>

  <!-- ====== STEP 2 ====== -->
  <g transform="translate(110, 75)">
    <rect x="0" y="0" width="85" height="65" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">2</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">DRILL PANEL HOLES</text>

    <g transform="translate(42.5, 35)">
      <!-- Wall panel laid flat -->
      <g transform="translate(-25, -8) scale(0.7)"><use href="#wallPanel"/></g>
      <!-- Drilled holes (small ellipses) -->
      <ellipse cx="-12" cy="-2" rx="2.5" ry="0.8" fill="#3A2810" stroke="black" stroke-width="0.3"/>
      <ellipse cx="0" cy="-2" rx="2.5" ry="0.8" fill="#3A2810" stroke="black" stroke-width="0.3"/>
      <ellipse cx="12" cy="-2" rx="2.5" ry="0.8" fill="#3A2810" stroke="black" stroke-width="0.3"/>
      <!-- Drill above -->
      <g transform="translate(0, -22)"><use href="#drill"/></g>
      <!-- Down arrow -->
      <path d="M 0 -3 L 0 -2.5" stroke="black" stroke-width="0.8" marker-end="url(#aMarkerB)"/>
    </g>
    <text x="42.5" y="58" text-anchor="middle" font-size="2.8" stroke="none">Drill Ø10 × 5–8 mm deep at each puck position.</text>
    <text x="42.5" y="62" text-anchor="middle" font-size="2.4" stroke="none" font-style="italic">See wall-panel-drilling-guide.svg for layout.</text>
  </g>

  <!-- ====== STEP 3 ====== -->
  <g transform="translate(15, 150)">
    <rect x="0" y="0" width="85" height="65" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">3</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">GLUE DOWELS</text>

    <g transform="translate(42.5, 35)">
      <!-- Panel front-on -->
      <g transform="translate(-25, -8) scale(0.7)"><use href="#wallPanel"/></g>
      <!-- Glue applied with dowel going in -->
      <g transform="translate(0, -8)"><use href="#glueBottle"/></g>
      <g transform="translate(0, -2) scale(0.8)"><use href="#dowel"/></g>
      <!-- Down arrow -->
      <path d="M 0 6 L 0 -3" stroke="black" stroke-width="0.8" marker-end="url(#aMarkerB)"/>
    </g>
    <text x="42.5" y="58" text-anchor="middle" font-size="2.8" stroke="none">Glue dowels into holes. 5 mm sticks out.</text>
    <text x="42.5" y="62" text-anchor="middle" font-size="2.4" stroke="none" font-style="italic">Let cure overnight before Step 5.</text>
  </g>

  <!-- ====== STEP 4 ====== -->
  <g transform="translate(110, 150)">
    <rect x="0" y="0" width="85" height="65" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">4</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">MOUNT PANEL TO WALL</text>

    <g transform="translate(42.5, 38)">
      <!-- Wall background -->
      <g transform="translate(-30, -20)"><use href="#wallBgB"/></g>
      <!-- Panel attaching -->
      <g transform="translate(-22, -15) scale(0.85)"><use href="#wallPanel"/></g>
      <!-- Dowels protruding from panel -->
      <ellipse cx="-15" cy="-10" rx="2" ry="0.6" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
      <ellipse cx="-5" cy="-10" rx="2" ry="0.6" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
      <ellipse cx="5" cy="-10" rx="2" ry="0.6" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
    </g>
    <text x="42.5" y="56" text-anchor="middle" font-size="2.8" stroke="none">French cleat, screws, or construction adhesive.</text>
    <text x="42.5" y="60" text-anchor="middle" font-size="2.4" stroke="none" font-style="italic">Panel size and shape are your choice.</text>
  </g>

  <!-- ====== STEP 5 ====== -->
  <g transform="translate(15, 225)">
    <rect x="0" y="0" width="85" height="55" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">5</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">PRESS PUCK ON DOWEL</text>

    <g transform="translate(42.5, 30)">
      <!-- Wall + panel + dowel exposed -->
      <g transform="translate(-30, -15) scale(0.6)"><use href="#wallBgB"/></g>
      <rect x="-22" y="-9" width="40" height="6" fill="#E0C88A" stroke="black" stroke-width="0.3"/>
      <rect x="-2" y="-3" width="4" height="3" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
      <!-- Puck approaching from front (left) -->
      <g transform="translate(-15, -2) rotate(-90)"><use href="#puckBackDrilled"/></g>
      <!-- Push arrow toward dowel -->
      <path d="M -2 0 L 8 0" stroke="black" stroke-width="1.2" marker-end="url(#aMarkerB)"/>
      <text x="3" y="-8" text-anchor="middle" font-size="2.5" stroke="none" font-weight="bold">PUSH</text>
    </g>
    <text x="42.5" y="50" text-anchor="middle" font-size="2.8" stroke="none">Align hole over dowel and push firmly until seated.</text>
  </g>

  <!-- ====== STEP 6 ====== -->
  <g transform="translate(110, 225)">
    <rect x="0" y="0" width="85" height="55" fill="white" stroke="black" stroke-width="0.3"/>
    <g transform="translate(8, 8)"><use href="#stepNumB"/><text x="0" y="1.5" text-anchor="middle" font-size="5" font-weight="bold" fill="white" stroke="none">6</text></g>
    <text x="18" y="10" font-size="3.5" font-weight="bold" stroke="none">HANG KNIFE</text>

    <g transform="translate(42.5, 30)">
      <g transform="translate(-30, -15) scale(0.6)"><use href="#wallBgB"/></g>
      <rect x="-22" y="-9" width="40" height="6" fill="#E0C88A" stroke="black" stroke-width="0.3"/>
      <!-- Puck on panel -->
      <g transform="translate(-5, -2) rotate(-90)"><use href="#puckObliqueB"/></g>
      <!-- Knife floating -->
      <g transform="translate(-13, -2) scale(0.45)"><use href="#knifeMiniB"/></g>
      <path d="M -16 -2 L -10 -2" stroke="black" stroke-width="0.4" stroke-dasharray="1,0.5" marker-end="url(#aMarkerB)"/>
    </g>
    <text x="42.5" y="50" text-anchor="middle" font-size="2.8" stroke="none">Knife on. Wood backing is invisible.</text>
  </g>

  <g transform="translate(15, 290)" stroke="none">
    <text x="0" y="0" font-size="2.6" font-style="italic" fill="#388E3C">✓ Cleanest "levitating" look. Pucks lift off the dowels for cleaning. If too loose, dip dowel in glue before pressing on.</text>
  </g>
</svg>
