<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="210mm"
     viewBox="0 0 210 210"
     font-family="Helvetica, Arial, sans-serif" font-size="3" fill="black" stroke="black">

  <defs>
    <pattern id="woodB" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <rect width="1.2" height="1.2" fill="#F3E1C0"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#A07A3A" stroke-width="0.12"/>
    </pattern>
    <pattern id="panelB" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#E0C88A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#805028" stroke-width="0.12"/>
    </pattern>
    <pattern id="magnetB" patternUnits="userSpaceOnUse" width="0.8" height="0.8" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#B0B0B8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#303036" stroke-width="0.12"/>
      <line x1="0" y1="0" x2="0.8" y2="0" stroke="#303036" stroke-width="0.12"/>
    </pattern>
    <pattern id="leatherB" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(-45)">
      <rect width="1.2" height="1.2" fill="#C07A3A"/>
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#5A2A10" stroke-width="0.15"/>
    </pattern>
    <marker id="arrB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 L1.5,3 z" fill="black"/>
    </marker>
    <marker id="arrBR" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M5,0 L0,3 L5,6 L3.5,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="200" height="200" fill="none" stroke="black" stroke-width="0.15"/>

  <g stroke="none">
    <text x="105" y="15" text-anchor="middle" font-size="5" font-weight="bold">Mount B — Dowel Socket Detail</text>
    <text x="105" y="20" text-anchor="middle" font-size="2.8">Back-face prep for hidden-panel dowel mounting. Dimensions in mm. 1:1 scale.</text>
  </g>

  <!-- ===== BACK VIEW OF PUCK ===== -->
  <g transform="translate(55, 65)">
    <text x="0" y="-28" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">PUCK — BACK VIEW (Mount B)</text>
    <text x="0" y="-24" text-anchor="middle" font-size="2.6" stroke="none">after drilling 10 mm dowel socket</text>

    <!-- Puck outer Ø25 -->
    <circle cx="0" cy="0" r="12.5" fill="url(#woodB)" stroke="black" stroke-width="0.3"/>
    <!-- Dowel socket Ø10 (the 4.5 through-hole is consumed) -->
    <circle cx="0" cy="0" r="5" fill="white" stroke="black" stroke-width="0.3"/>
    <!-- Hidden Ø20 pocket -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="0.15" stroke-dasharray="1,0.6"/>

    <!-- Centerlines -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="black" stroke-width="0.1" stroke-dasharray="4,0.8,0.3,0.8"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="black" stroke-width="0.1" stroke-dasharray="4,0.8,0.3,0.8"/>

    <!-- Ø25 dim -->
    <line x1="-12.5" y1="-18" x2="12.5" y2="-18" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="0" y="-18.5" text-anchor="middle" font-size="3" stroke="none">Ø25</text>

    <!-- Ø10 dim -->
    <line x1="3.54" y1="3.54" x2="15" y2="10" stroke="black" stroke-width="0.15"/>
    <line x1="15" y1="10" x2="22" y2="10" stroke="black" stroke-width="0.15"/>
    <text x="22.5" y="11" font-size="2.8" stroke="none">Ø10 × 5 deep (dowel socket)</text>

    <!-- Section marker -->
    <g stroke="none" font-size="3" font-weight="bold">
      <line x1="-17" y1="0" x2="-14" y2="0" stroke="black" stroke-width="0.4"/>
      <line x1="14" y1="0" x2="17" y2="0" stroke="black" stroke-width="0.4"/>
      <text x="-18.5" y="1" text-anchor="end">B</text>
      <text x="18.5" y="1">B</text>
    </g>
  </g>

  <!-- ===== SECTION B-B: puck + dowel + panel stack ===== -->
  <g transform="translate(140, 65)">
    <text x="0" y="-28" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">SECTION B-B (installed)</text>
    <text x="0" y="-24" text-anchor="middle" font-size="2.6" stroke="none">puck seated on dowel glued into wall panel</text>

    <!-- Wall panel on the right -->
    <!-- Panel 15 thick, 50 tall, at x from 5 to 20 -->
    <rect x="5" y="-25" width="15" height="50" fill="url(#panelB)" stroke="black" stroke-width="0.3"/>
    <text x="12.5" y="30" text-anchor="middle" font-size="2.6" stroke="none">Wall panel</text>
    <text x="12.5" y="33" text-anchor="middle" font-size="2.4" stroke="none">(hardwood/ply ≥15 thick)</text>

    <!-- Dowel: 10 long, 10 Ø (in this section view width 10). 5 into panel, 5 into puck -->
    <!-- Panel side: x from 5 to 10 (5mm deep), dowel width in Y = 10 centered on 0 -->
    <rect x="0" y="-5" width="10" height="10" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
    <text x="5" y="0" text-anchor="middle" font-size="2.3" stroke="none">dowel 10 Ø</text>
    <text x="5" y="3" text-anchor="middle" font-size="2.3" stroke="none">× 10 L</text>

    <!-- Puck: in section, 25 tall, 12 wide (wood). Front face on left. -->
    <!-- Puck position: x from -13 to -1 (12mm thickness), y from -12.5 to 12.5 -->
    <!-- Wood body -->
    <rect x="-13" y="-12.5" width="12" height="25" fill="url(#woodB)" stroke="black" stroke-width="0.3"/>
    <!-- Leather on front (left) -->
    <rect x="-14" y="-12.5" width="1" height="25" fill="url(#leatherB)" stroke="black" stroke-width="0.3"/>
    <!-- Magnet pocket: 5 deep from front, 20 tall. cut from wood -->
    <rect x="-11" y="-10" width="5" height="20" fill="white" stroke="none"/>
    <!-- Ring magnet in section: two bands, upper and lower, separated by 4.5mm gap -->
    <rect x="-11" y="-10" width="5" height="7.75" fill="url(#magnetB)" stroke="black" stroke-width="0.25"/>
    <rect x="-11" y="2.25" width="5" height="7.75" fill="url(#magnetB)" stroke="black" stroke-width="0.25"/>
    <!-- Dowel socket: cut into back of puck, 10 tall, 5 deep from back face (from x=-6 to x=-1) -->
    <rect x="-6" y="-5" width="5" height="10" fill="white" stroke="none"/>
    <!-- Dowel continuing into puck (5mm) -->
    <rect x="-5" y="-5" width="5" height="10" fill="#E9CF9C" stroke="black" stroke-width="0.3"/>
    <!-- Re-outline puck outer -->
    <line x1="-13" y1="-12.5" x2="-1" y2="-12.5" stroke="black" stroke-width="0.3"/>
    <line x1="-13" y1="12.5" x2="-1" y2="12.5" stroke="black" stroke-width="0.3"/>
    <line x1="-1" y1="-12.5" x2="-1" y2="-5" stroke="black" stroke-width="0.3"/>
    <line x1="-1" y1="5" x2="-1" y2="12.5" stroke="black" stroke-width="0.3"/>

    <!-- Labels / dims -->
    <!-- Puck thickness 12 -->
    <line x1="-13" y1="15" x2="-1" y2="15" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="-7" y="18" text-anchor="middle" font-size="2.8" stroke="none">12 puck</text>

    <!-- Dowel exposed length 5 -->
    <line x1="0" y1="-8" x2="5" y2="-8" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="2.5" y="-9" text-anchor="middle" font-size="2.4" stroke="none">5 glued</text>

    <line x1="-5" y1="-8" x2="0" y2="-8" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="-2.5" y="-9" text-anchor="middle" font-size="2.4" stroke="none">5 in puck</text>

    <!-- Panel thickness callout -->
    <line x1="5" y1="-15" x2="20" y2="-15" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="12.5" y="-16" text-anchor="middle" font-size="2.4" stroke="none">≥15 panel</text>

    <!-- Labels -->
    <text x="-13.5" y="-13.5" text-anchor="end" font-size="2.3" stroke="none">KNIFE SIDE →</text>
    <text x="21" y="0" font-size="2.3" stroke="none">← WALL</text>
  </g>

  <!-- ===== WALL PANEL BACK-FACE DRILL DETAIL ===== -->
  <g transform="translate(55, 160)">
    <text x="0" y="-28" text-anchor="middle" font-size="4" font-weight="bold" stroke="none">WALL PANEL — DOWEL HOLE</text>
    <text x="0" y="-24" text-anchor="middle" font-size="2.6" stroke="none">each knife position, in the hidden back panel</text>

    <!-- Panel section: 40 wide, 15 tall -->
    <rect x="-20" y="-7.5" width="40" height="15" fill="url(#panelB)" stroke="black" stroke-width="0.3"/>
    <!-- 10mm hole drilled 5-8mm deep from the front face (left side in this section view) -->
    <rect x="-20" y="-5" width="8" height="10" fill="white" stroke="black" stroke-width="0.3"/>
    <!-- Centerline -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="black" stroke-width="0.1" stroke-dasharray="4,0.8,0.3,0.8"/>

    <!-- Dims -->
    <line x1="-20" y1="-10" x2="-12" y2="-10" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="-16" y="-11" text-anchor="middle" font-size="2.4" stroke="none">5–8 deep</text>
    <line x1="-20" y1="-5" x2="-20" y2="5" stroke="black" stroke-width="0.2" marker-start="url(#arrBR)" marker-end="url(#arrB)"/>
    <text x="-22" y="0" text-anchor="end" font-size="2.4" stroke="none">Ø10</text>

    <text x="0" y="15" text-anchor="middle" font-size="2.6" stroke="none">Drill from FRONT face of panel with 10 mm Forstner, 5–8 mm deep.</text>
  </g>

  <!-- Notes -->
  <g transform="translate(110, 130)" stroke="none">
    <text x="0" y="0" font-size="3.5" font-weight="bold">MOUNT B INSTALL</text>
    <text x="0" y="5" font-size="2.6">1. Build puck body to spec (see puck-drawing.svg).</text>
    <text x="0" y="9" font-size="2.6">2. On puck back: drill 10 mm × 5 mm Forstner, centered.</text>
    <text x="0" y="13" font-size="2.6">3. Test friction-fit on scrap dowel — aim for ~1–2 kg pull-off.</text>
    <text x="0" y="17" font-size="2.6">4. Cut 10 mm dowels into 10 mm lengths.</text>
    <text x="0" y="21" font-size="2.6">5. Drill Ø10 × 5–8 mm into panel at knife positions.</text>
    <text x="0" y="25" font-size="2.6">6. Glue dowels into panel; 5 mm projects out.</text>
    <text x="0" y="29" font-size="2.6">7. Mount panel to wall (cleat / adhesive / screws).</text>
    <text x="0" y="33" font-size="2.6">8. Press pucks onto dowels. Done.</text>
    <text x="0" y="39" font-size="2.6" font-weight="bold">Layout: see wall-panel-drilling-guide.svg.</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80, 195)">
    <rect x="0" y="-2" width="50" height="4" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="0" y="-2" width="10" height="4" fill="black"/>
    <rect x="20" y="-2" width="10" height="4" fill="black"/>
    <rect x="40" y="-2" width="10" height="4" fill="black"/>
    <text x="25" y="-3.5" text-anchor="middle" font-size="2.8" stroke="none" font-weight="bold">1:1 SCALE — 50 mm</text>
  </g>
</svg>
